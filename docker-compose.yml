services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  message-queue:
    build:
      context: ../message-queue
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  event-catalog:
    build:
      context: ..
      dockerfile: event-catalog/Dockerfile
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - REDIS_URL=redis://redis:6379
      - MESSAGE_QUEUE_URL=http://message-queue:3004
    depends_on:
      redis:
        condition: service_healthy
      message-queue:
        condition: service_healthy
