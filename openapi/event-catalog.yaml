openapi: 3.1.0
info:
  title: event-catalog admin API
  description: |
    HTTP surface of the event-catalog service tier. Used by services
    (bulk-declare, subscriber registration), by operators (admin UI,
    topology, DLQ), and by Kubernetes / Prometheus (`/health`, `/metrics`).

    This spec is for **documentation and tooling**. SDK generation is a
    non-goal. The library half (`@connorhoehn/event-catalog`) is what
    producers actually publish through; this admin surface is the slow
    path.

    Source of truth for shapes: the handlers in `src/server/routes/*.ts`
    (wired onto the router by `src/server/routes.ts`) and
    `src/types/index.ts`. `scripts/openapi-check.ts` enforces that this
    file's routes, status codes and query parameters are grounded in
    those handlers.

    **Cross-cutting responses** every operation can return, not repeated
    per-operation below:

      - `401` — only when the deployment injects an `authMiddleware`
        (the catalog ships unauthenticated by design).
      - `404 {"error":"NotFound","path":...}` — no route matched.
      - `413` — request body over the 1 MiB `MAX_REQUEST_BODY_BYTES`
        cap; rejected by the HTTP layer before the handler runs. Only
        documented explicitly on operations that take a body.
      - `400 {"error":"InvalidJson"}` — an `application/json` body that
        did not parse.

    **Undocumented family**: `/api/feature-bundles/*` (see
    `src/server/bundle-routes.ts`) is mounted alongside `/api` but is
    not described here yet.
  version: 0.5.0
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:3010
    description: Local dev (docker compose)
  - url: http://event-catalog:3010
    description: In-cluster

tags:
  - name: events
    description: Event declarations + schema history
  - name: subscribers
    description: Per-event subscriber registration
  - name: topology
    description: Producer → event → consumer graph
  - name: transports
    description: Per-transport runtime introspection (signal channels, durable queues, DLQ)
  - name: ops
    description: Health, metrics, root endpoints
  - name: deprecation
    description: Event lifecycle — deprecation, poison-event detection

paths:
  /health:
    get:
      tags: [ops]
      summary: Tri-state health probe (Kubernetes-compatible)
      description: |
        Returns 200 when healthy or degraded, 503 when any check is
        unhealthy. This is `makeHealthHandler` (`src/server/health.ts`),
        NOT the same body as `GET /api/health`: it reports a `checks[]`
        array (ids `redis`, `message-queue`, `registry`) rather than
        named `redis` / `messageQueue` objects.
      responses:
        '200':
          description: Healthy or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceHealthResponse' }
        '503':
          description: Unhealthy — at least one check reported unhealthy or timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceHealthResponse' }

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus exposition (text/plain)
      description: |
        OpenMetrics / Prometheus text format. Counters for declares,
        publishes, schema fetches, compat violations, plus per-transport
        gauges. Scraped by the cluster's Prometheus instance.
      responses:
        '200':
          description: Metrics text
          content:
            text/plain:
              schema: { type: string }

  /api/events:
    get:
      tags: [events]
      summary: List event declarations
      description: |
        Returns every declared event in one unpaginated response.

        **This endpoint is deliberately not paginated and takes no
        projection parameter.** At 225 declarations the body is ~302 KB,
        of which the bulk is the embedded `schema` objects — but it
        gzips to ~42 KB, an 86% reduction, because JSON Schema across a
        registry is overwhelmingly repeated keys. A `fields=` projection
        that dropped `schema` and `schemaHistory` would give ~53 KB
        uncompressed, i.e. *worse than simply compressing the full body*,
        and would add a parameter with no caller. Pagination is worse
        still: the admin UI's list, topology and dashboard views all
        filter and aggregate the complete registry client-side from a
        single fetch, so paging this route would only make every consumer
        loop to reassemble what it already asks for.

        The lever that matters is transport compression, which is a server
        config concern rather than an API shape. Callers that need only
        fingerprints already have the cheap path: `GET /api/fingerprints`
        is ~20 KB at the same registry size.

        Every filter below is single-valued and does not scale with the
        registry — the request-line cost of this endpoint is bounded by
        `MAX_EVENT_NAME_LENGTH` (512), not by how many events exist.
      parameters:
        - in: query
          name: transport
          schema: { type: string, enum: [signal, durable, both] }
        - in: query
          name: producer
          schema: { type: string }
        - in: query
          name: subscriber
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: namespace
          schema: { type: string }
          description: Phase E7 — restrict to events in this namespace.
      responses:
        '200':
          description: Filtered or full list
          content:
            application/json:
              schema:
                type: object
                required: [events, total]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/RegistryEntry' }
                  total: { type: integer }
        '400':
          description: |
            A filter was repeated (`?transport=a&transport=b`) or
            `transport` was outside the enum. Every filter here is
            single-valued; the repeated form used to be cast straight
            through and silently returned an empty list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [events]
      summary: Declare an event (with optional compat gate)
      description: |
        Idempotent: re-declaring an existing event with a changed schema
        bumps the version and appends the prior schema to `schemaHistory`
        (capped at 5 entries).

        **Compat gate**: when `compatMode` is `strict` (per-event), or the
        request carries `x-event-catalog-strict: true`, or the
        `EVENT_CATALOG_STRICT=true` env var is set, a compat-violating
        update returns **409** without mutating the registry.

        `channel` may be a string here; the function form is library-only
        (functions don't serialize over HTTP).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventDeclarationInput' }
      parameters:
        - in: header
          name: x-event-catalog-strict
          required: false
          schema: { type: string, enum: ['true', 'false'] }
          description: Per-request strict-mode override (`true` enables strict).
        - in: query
          name: check-manifests
          required: false
          schema: { type: string, enum: [off, warn, strict] }
          description: |
            wave23-c — manifest-aware deploy gate. When set, the
            server checks every pinned consumer manifest before
            applying the declare. If the proposed schema would change
            the event's fingerprint and a pinned consumer's manifest
            references this event at the current fingerprint, the
            consumer would be staled.
              `strict` → 409 PINNED_CONSUMER_BREAK with affectedConsumers; declare aborts
              `warn`   → 201 with affectedConsumers field; declare proceeds
              `off`    → no check (default; back-compat)
      responses:
        '201':
          description: Declared
          content:
            application/json:
              schema:
                type: object
                required: [declared, version, compatible, schemaFingerprint]
                properties:
                  declared: { type: string }
                  version: { type: integer }
                  compatible: { type: boolean }
                  schemaFingerprint:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                    description: sha256 of the canonical schema serialization (Phase E6).
                  violations:
                    type: array
                    items: { type: string }
                    description: Present when an evolution had compat violations (warn mode).
                  affectedConsumers:
                    type: array
                    description: |
                      Present only under `?check-manifests=warn` when the
                      declare would stale at least one pinned consumer.
                    items:
                      type: object
                      required: [consumerName, pinnedFingerprint]
                      properties:
                        consumerName: { type: string }
                        pinnedFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        '400':
          description: |
            Missing `name` / `transport` / `producer`, a `transport`
            outside the enum, an event name rejected by
            `validateEventName` (over 512 chars, containing control
            characters, or one of `__proto__` / `constructor` /
            `prototype`), or a `Registry.declare` rejection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Either a compat violation under strict mode
            (`COMPAT_VIOLATION`), or — under `?check-manifests=strict` —
            a fingerprint change that would stale a pinned consumer
            (`PINNED_CONSUMER_BREAK`). The `error.code` discriminates.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CompatViolationError'
                  - $ref: '#/components/schemas/PinnedConsumerBreakError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/events/bulk:
    post:
      tags: [events]
      summary: Bulk-declare from a service (called once at startup)
      description: |
        Used by `syncToRemoteRegistry()` in the library on `connect()` and
        on its 60-second periodic re-sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceName, events]
              properties:
                serviceName: { type: string }
                events:
                  type: array
                  maxItems: 1000
                  description: |
                    At most `MAX_BULK_EVENTS` (1000) declarations per
                    request — over that the whole request is rejected
                    with 400. Entries missing `name` or `transport`, and
                    entries whose `Registry.declare` throws, are skipped
                    silently; entries with an unusable name come back in
                    `rejected`.
                  items: { $ref: '#/components/schemas/EventDeclarationInput' }
      responses:
        '201':
          description: |
            Bulk declare processed. Always 201, even when every entry was
            skipped or rejected — callers must read `declared` / `rejected`.
          content:
            application/json:
              schema:
                type: object
                required: [declared, count]
                properties:
                  declared:
                    type: array
                    items: { type: string }
                  count: { type: integer }
                  rejected:
                    type: array
                    description: |
                      Omitted entirely when nothing was rejected. Present
                      for names refused by `validateEventName`; the name
                      is truncated to 128 characters in the echo.
                    items:
                      type: object
                      required: [name, error]
                      properties:
                        name: { type: string }
                        error: { type: string }
        '400':
          description: Missing `serviceName`, missing/non-array `events`, or more than 1000 entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/events/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [events]
      summary: Fetch one event declaration (with optional historical version)
      description: |
        Also serves as the schema-fetch endpoint for downstream validators.
        Bumps the per-event schema-fetch counter on success.

        `?version=N` selects an entry from `schemaHistory`. Out-of-range
        versions return 404.
      parameters:
        - in: query
          name: version
          schema: { type: integer, minimum: 1 }
          description: Optional historical version selector.
      responses:
        '200':
          description: Full registry entry with stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RegistryEntry'
                  - type: object
                    required: [validationMode]
                    properties:
                      validationMode:
                        type: string
                        enum: [off, warn, strict]
                        description: |
                          Always `off` today — validation enforcement is
                          system-wide and per-event overrides are not yet
                          surfaced here (EC-6/EC-7).
        '400':
          description: Repeated `?version=` key, or a value that is not a positive integer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Event not declared, or version not in history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [events]
      summary: Remove an event declaration
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: string }
        '404':
          description: Not declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/events/{name}/schema/check:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    post:
      tags: [events]
      summary: Dry-run schema compat check (no mutation)
      description: |
        Checks a proposed schema against the registered schema's
        `compatibilityMode` without applying. Useful for CI gates that
        want to fail before merge.

        This is the canonical form of the check. The `get` variant below
        exists only for callers that predate it.

        The body is read first; if it carries no `schema`, the handler
        falls back to the same URL-encoded `?schema=` param the `get`
        form uses. One of the two must be present.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [schema]
              properties:
                schema: { type: object, description: JSON Schema (draft-07) }
      parameters:
        - in: query
          name: schema
          required: false
          schema: { type: string }
          description: |
            URL-encoded JSON Schema object. Fallback for callers that
            send no request body; the body wins when both are present.
      responses:
        '200':
          description: Compat result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompatCheckResponse' }
        '400':
          description: |
            No schema supplied on either the body or `?schema=`, a
            non-object `schema`, an unparseable `?schema=`, or a
            repeated `?schema=` key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Event not declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    get:
      tags: [events]
      summary: Dry-run schema compat check (query-param form)
      deprecated: true
      description: |
        Same check as `POST`, with the proposed schema supplied as a
        URL-encoded JSON `?schema=` parameter.

        This route originally required a JSON request body on a `GET`,
        which browsers cannot send and many proxies and HTTP clients
        drop — the check was unreachable for those callers. Prefer
        `POST`; a request body is still honored here for back-compat.

        **It also does not fit.** A URL-encoded JSON Schema is the other
        query parameter here whose length is unbounded by anything the
        server controls: the largest schema currently declared
        (`sfu.recording.completed`) is 3503 bytes raw and **5183 bytes
        URL-encoded**, already past the 4 KB request-line tier and closing
        on the 8 KB one, while the average is ~1.1 KB. A schema that
        exceeds the intermediary's ceiling is rejected with a 414 or
        truncated into an unparseable `?schema=` — which this route
        reports as a 400 "unparseable schema", pointing the caller at
        their JSON rather than at the URL. `POST` has no such limit until
        the 1 MiB body cap.
      parameters:
        - in: query
          name: schema
          required: true
          schema: { type: string }
          description: |
            URL-encoded JSON Schema (draft-07) object. Practical ceiling is
            the request-line limit of every hop between the caller and this
            server (commonly 4–8 KB), not a server-side cap.
      responses:
        '200':
          description: Compat result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompatCheckResponse' }
        '400':
          description: Missing, unparseable, or non-object schema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Event not declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/events/{name}/stats:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [events]
      summary: Live publish-rate / error counters for one event
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventStats' }
        '404':
          description: No stats recorded for this event yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/events/{name}/history:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [events]
      summary: Recent message history (signal events only)
      description: |
        For signal events, returns the last N envelopes from the
        per-channel Redis ring buffer. Durable events return an empty
        array with a `note` (message-queue peek not yet implemented).

        An event declared `transport: both` takes the durable branch, so
        the reported `transport` is only ever `signal` or `durable`.
      parameters:
        - in: query
          name: count
          schema: { type: integer, default: 50 }
          description: |
            Parsed with `parseInt`, falling back to 50 for anything that
            does not parse (including `0`). Not otherwise bounded — the
            underlying Redis ring buffer caps the real result size.
      responses:
        '200':
          description: History (may be empty)
          content:
            application/json:
              schema:
                type: object
                required: [messages, transport]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/EventEnvelope' }
                  transport: { type: string, enum: [signal, durable] }
                  note:
                    type: string
                    description: Present only on the durable branch.
        '400':
          description: Repeated `?count=` key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Event not declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/events/{name}/subscribers:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    post:
      tags: [subscribers]
      summary: Register a service as a subscriber to an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceName]
              properties:
                serviceName: { type: string }
      responses:
        '201':
          description: Subscriber registered
          content:
            application/json:
              schema:
                type: object
                required: [event, subscriber]
                properties:
                  event: { type: string }
                  subscriber: { type: string }
        '400':
          description: Missing serviceName
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Event not declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/events/{name}/subscribers/{serviceName}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
      - in: path
        name: serviceName
        required: true
        schema: { type: string }
    delete:
      tags: [subscribers]
      summary: Deregister a subscriber
      responses:
        '200':
          description: Subscriber removed
          content:
            application/json:
              schema:
                type: object
                required: [event, removedSubscriber]
                properties:
                  event: { type: string }
                  removedSubscriber: { type: string }
        '404':
          description: Event not declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/fingerprints:
    get:
      tags: [events]
      summary: Flat fingerprint manifest
      description: |
        Phase 21-e — returns `{ <eventName>: <schemaFingerprint> }` for
        every declared event. Cheaper than `GET /api/events` when the
        caller only needs fingerprints (CI drift detection, schema-
        change diffs across deploys).

        ```bash
        $ curl /api/fingerprints > current.json
        $ diff snapshot.json current.json
        ```
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
          description: Restrict the manifest to one namespace.
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  pattern: '^[0-9a-f]{64}$'

  /api/freshness:
    post:
      tags: [events]
      summary: Server-side fingerprint comparator
      description: |
        Phase 21-g — mirror of the client-side `checkAllSchemaFreshness`
        helper. Thin consumers (lambdas, batch jobs) POST a list of
        `{name, fingerprint}` pairs and receive a per-event drift
        report without having to instantiate the full EventCatalog
        client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 5000
                  description: |
                    At most `MAX_FRESHNESS_EVENTS` (5000) entries. An
                    entry missing a string `name` or `fingerprint` is not
                    rejected — it comes back with `status: "invalid"`.
                  items:
                    type: object
                    required: [name, fingerprint]
                    properties:
                      name: { type: string }
                      fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: Per-event freshness report
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports:
                    type: array
                    items:
                      type: object
                      required: [name, status]
                      properties:
                        name:
                          type: string
                          description: Empty string when the request entry had no string `name`.
                        status:
                          type: string
                          enum: [fresh, stale, unknown, invalid]
                        localFingerprint:
                          type: string
                          description: Absent on `invalid` entries.
                        remoteFingerprint:
                          type: [string, 'null']
                          description: Absent on `invalid` entries; `null` when the event is unknown.
                        error:
                          type: string
                          description: Present only on `invalid` entries.
        '400':
          description: Body `events` missing, not an array, or over 5000 entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/topology:
    get:
      tags: [topology]
      summary: Producer → event → consumer graph
      description: |
        Filters AND-combine. Empty filters returns the full graph. The
        result is "induced" — referenced services come along but their
        unrelated events do not.
      parameters:
        - in: query
          name: producer
          schema: { type: string }
        - in: query
          name: consumer
          schema: { type: string }
        - in: query
          name: eventType
          schema: { type: string }
          description: Exact match on the canonical event name.
        - in: query
          name: transport
          schema: { type: string }
          description: |
            Compared with strict equality against the declaration's
            `transport`, so only `signal`, `durable` and `both` can
            match — but unlike `GET /api/events` this handler does NOT
            validate the value; an unknown one yields an empty subgraph
            rather than a 400.
        - in: query
          name: namespace
          schema: { type: string }
          description: Phase E7 — restrict the induced subgraph to one namespace.
      responses:
        '200':
          description: Topology graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologyGraph' }
        '400':
          description: |
            A filter key was repeated (`?producer=a&producer=b`). The
            repeated form used to collapse to `undefined`, silently
            widening the response back to the full topology.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/audit:
    get:
      tags: [events]
      summary: Live registry-mutation audit (SSE)
      description: |
        wave22-d — Server-Sent Events stream of structured AuditEvents
        emitted whenever the registry mutates: declarations land
        (`event.declared` / `event.version.bumped`), declarations are
        removed (`event.removed`), or subscribers are added/removed
        (`subscriber.added` / `subscriber.removed`).

        Mirror of `/api/flow` (which streams the *fast path* — every
        message flowing through the catalog) for the *slow path* —
        every change to the registered contracts. Powers admin UI
        "registry changes" panels and live audit dashboards.

        Filters AND-combine. Stream opens with a `: connected;` comment
        and includes 30-second heartbeats.

        wave23-a — when the persistent audit log is wired and
        `?replay=N` is passed, the last N events from the log are
        flushed as SSE frames *before* the live stream begins. Each
        replayed frame carries `_replay: true` so the client can
        distinguish history from live.
        Every filter here is best-effort: an unrecognized `kind`, or any
        filter sent as a repeated key, is treated as "no filter" rather
        than rejected. An SSE client that mistypes a filter is better
        served by an open stream than by a 400 it never reads.
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - event.declared
              - event.version.bumped
              - event.removed
              - event.deprecated
              - event.undeprecated
              - event.poisoned
              - event.poison.cleared
              - subscriber.added
              - subscriber.removed
              - event.manifest.drift
          description: A value outside this set is ignored, not rejected.
        - in: query
          name: eventName
          schema: { type: string }
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: serviceName
          schema: { type: string }
        - in: query
          name: replay
          schema: { type: integer, minimum: 0, maximum: 1000, default: 0 }
          description: |
            Number of historical events to replay before streaming live
            (wave23-a). Clamped to `MAX_AUDIT_QUERY_LIMIT` (1000), not
            rejected; ignored when no persistent audit log is wired.
      responses:
        '200':
          description: SSE stream (long-lived)
          content:
            text/event-stream:
              schema: { type: string, description: SSE-formatted AuditEvent frames }
        '503':
          $ref: '#/components/responses/TooManyStreams'

  /api/asyncapi:
    get:
      tags: [events]
      summary: AsyncAPI 3.0 spec generated from the registry (wave24-c)
      description: |
        Returns an AsyncAPI 3.0 document generated from the current
        registry state. Lets operators feed catalog declarations into
        existing AsyncAPI tooling (codegen, validators, doc renderers)
        without adopting a separate schema-of-record.

        Mapping:
          - Each declaration → one or more `operation`s (one per producer).
          - `transport: 'both'` → two operations on two channels.
          - `schema` → `components.schemas[...]` (JSON Schema 1:1).
          - `tags` → `message.tags` + `operation.tags`.
          - `channel` (signal) / `queue` (durable) → channel `address`.
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
          description: Restrict the spec to one namespace.
      responses:
        '200':
          description: AsyncAPI 3.0 document
          content:
            application/json:
              schema:
                type: object
                description: AsyncAPI 3.0 spec object.

  /api/heartbeat:
    post:
      tags: [subscribers]
      summary: Refresh subscriber lastSeenAt timestamps (wave24-b)
      description: |
        Subscribers POST here periodically to keep their registrations
        alive. The server tracks `lastSeenAt` per (event, service) pair
        and a background sweeper prunes pairs older than
        `SUBSCRIBER_TTL_SECONDS` (default 1800 = 30 min). Without
        heartbeats, dead consumers would pollute /api/topology.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceName]
              properties:
                serviceName: { type: string }
                events:
                  type: array
                  description: |
                    Optional — when omitted, every event the service
                    currently subscribes to is refreshed.
                  items: { type: string }
      responses:
        '200':
          description: Refreshed subscriptions
          content:
            application/json:
              schema:
                type: object
                required: [serviceName, refreshed, count]
                properties:
                  serviceName: { type: string }
                  refreshed:
                    type: array
                    description: |
                      The subset of events actually refreshed — a service
                      may have been pruned by the TTL sweeper in the
                      meantime, so this can be shorter than the request.
                    items: { type: string }
                  count: { type: integer }
        '400':
          description: |
            `serviceName` missing or not a non-empty string. A malformed
            `events` (not an array of strings) is ignored, not rejected —
            it is treated as if omitted, refreshing every subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/subscribers:
    get:
      tags: [subscribers]
      summary: List every subscriber + lastSeenAt (wave24-b)
      parameters:
        - in: query
          name: staleAfter
          schema: { type: integer, minimum: 1 }
          description: |
            Seconds — return only subscribers older than the threshold.
            Anything that does not parse as a positive integer (including
            a repeated key) is ignored and the full list is returned.
      responses:
        '200':
          description: Subscribers + heartbeat timestamps
          content:
            application/json:
              schema:
                type: object
                required: [subscribers, total]
                properties:
                  subscribers:
                    type: array
                    items:
                      type: object
                      required: [eventName, serviceName, lastSeenAt]
                      properties:
                        eventName: { type: string }
                        serviceName: { type: string }
                        lastSeenAt: { type: string, format: date-time }
                  total: { type: integer }
                  filter:
                    type: object
                    description: Echoed only when `?staleAfter=` was applied.
                    required: [staleAfter]
                    properties:
                      staleAfter: { type: integer }

  /api/manifests:
    get:
      tags: [events]
      summary: List every pinned consumer manifest
      description: |
        wave23-b — consumer manifest pinning. A consumer "pins" the
        events + fingerprints it depends on by PUT-ing a manifest;
        operators see drift across all pinned consumers via
        `GET /api/manifests/check/all`.
      responses:
        '200':
          description: All manifests
          content:
            application/json:
              schema:
                type: object
                required: [manifests, count]
                properties:
                  manifests:
                    type: array
                    items: { $ref: '#/components/schemas/ConsumerManifest' }
                  count: { type: integer }

  /api/manifests/{consumerName}:
    parameters:
      - in: path
        name: consumerName
        required: true
        schema: { type: string }
    put:
      tags: [events]
      summary: Pin a consumer's manifest
      description: |
        Replaces the consumer's pinned set wholesale. `consumerName`
        comes straight off the path and is capped at
        `MAX_CONSUMER_NAME_LENGTH` (256) because it becomes a
        never-expiring Redis hash field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 5000
                  description: At most `MAX_MANIFEST_EVENTS` (5000) entries.
                  items:
                    type: object
                    required: [name, fingerprint]
                    properties:
                      name: { type: string }
                      fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '201':
          description: Manifest stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsumerManifest' }
        '400':
          description: |
            `consumerName` over 256 characters, `events` missing or not
            an array, over 5000 entries, or an entry whose `name` /
            `fingerprint` is not a string.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    get:
      tags: [events]
      summary: Fetch one consumer's manifest
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsumerManifest' }
        '404':
          description: No manifest pinned for that consumer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [events]
      summary: Remove a consumer's manifest
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: string }
        '404':
          description: No manifest to remove
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/manifests/check/all:
    get:
      tags: [events]
      summary: Drift report across every pinned consumer
      description: |
        Compares each pinned manifest's fingerprints against the
        registry's current values; returns a per-consumer report
        with `fresh`/`stale`/`unknown` counts.
      responses:
        '200':
          description: Drift reports
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports:
                    type: array
                    items: { $ref: '#/components/schemas/ManifestDriftReport' }

  /api/audit/recent:
    get:
      tags: [events]
      summary: Persistent audit log query
      description: |
        wave23-a — returns the last N audit events from the Redis-
        backed audit log without subscribing to live SSE. Useful for
        one-off lookups and for the admin UI's initial render (avoids
        a slow-to-paint blank panel before the first live event).
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
          description: |
            Rejected with 400 above `MAX_AUDIT_QUERY_LIMIT` (1000).
            Values that do not parse fall back to 50; values below 1 are
            clamped up to 1.
      responses:
        '200':
          description: Recent audit events in chronological order
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        timestamp: { type: string, format: date-time }
                        eventName: { type: string }
                        namespace: { type: string }
                        version: { type: integer }
                        fingerprint: { type: string }
                        serviceName: { type: string }
                  note:
                    type: string
                    description: Present when no audit log is wired (returns empty events).
        '400':
          description: '`limit` above 1000'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/flow:
    get:
      tags: [transports]
      summary: Live event flow (SSE)
      description: |
        Phase E8 — Server-Sent Events stream of every event observed
        flowing through the catalog. Powered by the process-internal
        `tapEmitter`; populated by `MetricsObserver`'s existing signal
        subscriptions plus the durable poll loop.

        Filters AND-combine. `sample=N` emits only every Nth event
        (sane for high-volume namespaces). The stream opens with a
        `: connected;` comment and includes 30-second heartbeats.

        Auth: the admin server is currently unauthenticated (private/
        in-cluster surface); harden behind a reverse proxy in prod.

        Event frame example:
        ```
        data: {"eventName":"pipeline.run.started","namespace":"pipeline",
        "producer":"distributed-core","transport":"signal",
        "timestamp":"2026-05-15T14:00:00.000Z","channel":"pipeline.run.started",
        "envelope":{...}}
        ```
      parameters:
        - in: query
          name: eventName
          schema: { type: string }
          description: Exact-match on the canonical event name.
        - in: query
          name: transport
          schema: { type: string, enum: [signal, durable] }
          description: |
            A value outside this set — and any filter sent as a repeated
            key — is ignored rather than rejected. This route never
            returns 400.
        - in: query
          name: producer
          schema: { type: string }
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: sample
          schema: { type: integer, minimum: 1, default: 1 }
          description: |
            Emit 1-in-N events. 1 = unfiltered. Clamped to a minimum of
            1; a value that does not parse falls back to 1.
      responses:
        '200':
          description: SSE stream (long-lived)
          content:
            text/event-stream:
              schema: { type: string, description: SSE-formatted event frames }
        '503':
          $ref: '#/components/responses/TooManyStreams'

  /api/transports/signal/channels:
    get:
      tags: [transports]
      summary: Per-channel signal publish counts and subscriber counts
      responses:
        '200':
          description: Channel list
          content:
            application/json:
              schema:
                type: object
                required: [channels, total]
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      required: [channel, publishCount, lastPublishedAt, subscriberCount]
                      properties:
                        channel: { type: string }
                        publishCount: { type: integer }
                        lastPublishedAt:
                          type: [string, 'null']
                        subscriberCount: { type: integer }
                  total: { type: integer }

  /api/transports/durable/queues:
    get:
      tags: [transports]
      summary: Per-queue durable publish / receive / failure counts
      responses:
        '200':
          description: Queue list
          content:
            application/json:
              schema:
                type: object
                required: [queues, total]
                properties:
                  queues:
                    type: array
                    items:
                      type: object
                      required: [queue, sent, received, failed, inFlight]
                      properties:
                        queue: { type: string }
                        sent: { type: integer }
                        received: { type: integer }
                        failed: { type: integer }
                        inFlight: { type: integer }
                  total: { type: integer }

  /api/transports/durable/dlq:
    get:
      tags: [transports]
      summary: List dead-letter queue entries
      description: |
        Backed by the DDB-based `DLQStore`. On DDB error, falls back to
        this process's in-memory mirror and reports
        `source: "in-memory"`.

        Entries are always `DlqEntry` — both sources are normalized to
        the one shape, so clients do **not** branch on `source`. Read
        `source` to know the answer is degraded: the mirror holds only
        what this replica dead-lettered since it started, so a short
        list there is not evidence of a clean DLQ, and the ids it
        returns are not resolvable by the replay/delete routes while
        DynamoDB is down.

        `?eventName=` and `?limit=` are applied to either source.
      parameters:
        - in: query
          name: eventName
          schema: { type: string }
          description: Repeating the key is rejected with 400, not silently joined.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000 }
          description: |
            Must be a positive integer no greater than 1000
            (`MAX_DLQ_LIMIT`) — anything else is a 400, not a clamp.
      responses:
        '200':
          description: DLQ entries
          content:
            application/json:
              schema:
                type: object
                required: [messages, total, source]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/DlqEntry' }
                  total: { type: integer }
                  source:
                    type: string
                    enum: [store, in-memory]
                    description: |
                      Which source answered. `in-memory` means the
                      durable store failed and this is a degraded,
                      single-replica view; `error` is set alongside it.
                      The response is 200 either way.
                  error:
                    type: string
                    description: |
                      Operator-facing reason the answer is degraded.
                      Redacted — the underlying AWS SDK text is written
                      to the server log, not returned here.
        '400':
          description: Repeated `?eventName=`, or a `limit` outside 1..1000
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/transports/durable/dlq/clear:
    post:
      tags: [transports]
      summary: Bulk-clear DLQ entries
      description: |
        Removes all DLQ entries, or all entries for a specific event when
        `?eventName=` is provided. Returns the number of entries cleared.
        Useful for purging test noise or retiring a dead event before M2.
      parameters:
        - in: query
          name: eventName
          schema: { type: string }
          description: Scope the clear to one event's DLQ entries (optional)
      responses:
        '200':
          description: Number of entries cleared
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: integer }
        '400':
          description: Repeated `?eventName=` key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/transports/durable/dlq/replay:
    post:
      tags: [transports]
      summary: Batch-redrive multiple DLQ entries (Phase E5.2)
      description: |
        Replays N DLQ entries in one call. Each entry is re-published
        with its original id as the message metadata.id, so partial-
        failure retries on the same set don't double-deliver downstream.

        Always returns 200 with a per-id breakdown; callers inspect
        `failed[]` to decide retry policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: |
                    At most `MAX_DLQ_REPLAY_IDS` (100) — each id costs a
                    DynamoDB read plus a message-queue POST, run
                    sequentially inside the request.
                  items: { type: string }
      responses:
        '200':
          description: Per-id outcome
          content:
            application/json:
              schema:
                type: object
                required: [replayed, failed, total]
                properties:
                  replayed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        eventName: { type: string }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        error:
                          type: string
                          description: |
                            `not found` when the id has no DLQ entry;
                            otherwise a redacted replay-failure message
                            — the raw transport error goes to the server
                            log, not to the client.
                  total: { type: integer }
        '400':
          description: '`ids` missing, empty, containing a non-string, or over 100 entries'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/transports/durable/dlq/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      tags: [transports]
      summary: Drop a single DLQ entry without replay
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: string }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/transports/durable/dlq/{id}/replay:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [transports]
      summary: Redrive a DLQ entry back into its source queue
      description: |
        Re-publishes the entry's envelope to the original event's queue
        (derived from `entry.eventName`), then drops the DLQ row on
        success. Idempotency keys are reused so partial-failure retries
        don't duplicate delivery downstream.
      responses:
        '200':
          description: Replay succeeded
          content:
            application/json:
              schema:
                type: object
                required: [replayed, eventName]
                properties:
                  replayed: { type: string }
                  eventName: { type: string }
        '404':
          description: DLQ entry not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: |
            Replay failed (publish error). The message is redacted — the
            underlying message-queue error is written to the server log.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/events/poisoned:
    get:
      tags: [deprecation]
      summary: List events that exceeded the failure threshold (wave26-e)
      responses:
        '200':
          description: Poisoned events
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PoisonState' }

  /api/events/bulk/deprecate:
    post:
      tags: [deprecation]
      summary: Bulk-deprecate N events with a shared reason (wave26-f)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: At most `MAX_BULK_DEPRECATE_NAMES` (1000) names.
                  items: { type: string }
                reason: { type: string }
                by: { type: string }
      responses:
        '200':
          description: |
            At least one name was deprecated. Partial success (some names
            in `notFound`) is still a 200.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkDeprecateResult' }
        '400':
          description: |
            Two different bodies share this status.

            When `names` is missing, empty, not an array, or over 1000
            entries, the body is the standard `Error` envelope. When
            `names` was well-formed but **every** name was unknown, the
            body is the same `BulkDeprecateResult` as the 200 — with an
            empty `deprecated` — not an `Error`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/BulkDeprecateResult'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/events/bulk/export:
    post:
      tags: [events]
      summary: JSON export of N event declarations, name list in the body
      description: |
        Same archive as the GET, with the name list carried in a JSON body
        instead of the URL. **This is the form to use for anything but a
        handful of names.**

        A comma-joined `?names=` scales with the registry and the URL runs
        out first: 225 declarations produce a 5.8 KB URL-encoded query
        string, and 1000 would produce ~25.9 KB. Request-line ceilings in
        the wild are 4–8 KB (nginx's `large_client_header_buffers`
        defaults to 8k; several CDNs and load balancers sit at the same
        figure, some proxies at 4 KB). Over the line you get either a 414
        or — worse — a silently truncated list, which exports a shorter
        archive than you asked for and looks like it worked.

        `names` is capped at 1000 entries (`MAX_BULK_EXPORT_NAMES`),
        matching every other bulk surface. Omit it (or send `[]`) to
        export the whole registry. Names that are not declared are skipped
        silently rather than 404-ing, so `eventCount` can be lower than
        the number of names requested.

        `Content-Disposition: attachment` is set on this response too, so
        a `fetch` caller can save the blob directly; a plain browser
        download from an `<a href>` still needs the GET.

        The archive entries are a **projection**, not full registry
        entries: no `compatibilityMode`, `schemaHistory`, `subscribers`,
        `metadata` or `stats`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  type: array
                  maxItems: 1000
                  items: { type: string }
                  description: |
                    Event names to export. Omit or send an empty array to
                    export every declared event.
      responses:
        '200':
          description: Export archive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportArchive' }
        '400':
          description: |
            `names` is not an array of strings, or holds more than 1000
            entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    get:
      tags: [events]
      summary: JSON export of N event declarations (wave26-f)
      description: |
        Returns a JSON archive with schema + fingerprint for each named event.
        Sets `Content-Disposition: attachment` so browsers download the file.
        When no `names` param is provided, exports all events.

        **Practical limit — prefer `POST` for lists.** `?names=` is
        comma-joined into the URL, so its length scales with the number of
        names: at this platform's ~23.9 URL-encoded bytes per name, roughly
        **341 names fit in an 8 KB request line and 169 in a 4 KB one**.
        The server's own cap is 1000 names, which no proxy will deliver —
        the URL fails first, and a truncating intermediary produces a
        short archive rather than an error. Use this route for a browser
        download (`<a href>` + `Content-Disposition`, which POST cannot
        do) or for a handful of names; use `POST` for everything else.

        Not deprecated: exporting the whole registry needs no `?names=` at
        all, and that zero-length case is the admin UI's download button.

        The archive entries are a **projection**, not full registry
        entries: no `compatibilityMode`, `schemaHistory`, `subscribers`,
        `metadata` or `stats`.
      parameters:
        - in: query
          name: names
          schema: { type: string }
          description: |
            Comma-separated list of event names; blank segments are
            dropped. Omit to export all. Names that are not declared are
            skipped silently rather than 404-ing, so `eventCount` can be
            lower than the number of names requested. Capped at 1000
            entries, though the URL length ceiling above binds long before
            that.
      responses:
        '200':
          description: Export archive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportArchive' }
        '400':
          description: Repeated `?names=` key, or more than 1000 names
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/events/{name}/deprecate:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    post:
      tags: [deprecation]
      summary: Mark an event deprecated (wave25-a)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                by: { type: string }
      responses:
        '200':
          description: Event deprecated
          content:
            application/json:
              schema:
                type: object
                required: [deprecated, deprecation]
                properties:
                  deprecated: { type: string }
                  deprecation: { $ref: '#/components/schemas/DeprecationInfo' }
        '404':
          description: Event not declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    delete:
      tags: [deprecation]
      summary: Remove deprecation from an event (wave25-a)
      responses:
        '200':
          description: Undeprecated
          content:
            application/json:
              schema:
                type: object
                required: [undeprecated]
                properties:
                  undeprecated: { type: string }
        '404':
          description: |
            Event not declared **or** not currently deprecated — the
            handler does not distinguish the two.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/events/{name}/producers/observed:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [events]
      summary: Observed vs declared producer attribution (wave26-c)
      description: |
        Returns the declared producers alongside producers actually observed
        emitting the event (via envelope metadata). Flags undeclared producers
        and declared producers that have gone silent.
      responses:
        '200':
          description: Attribution report
          content:
            application/json:
              schema:
                type: object
                required: [eventName, declared, observed, undeclaredProducers, deadDeclaredProducers, mismatch]
                properties:
                  eventName: { type: string }
                  declared:
                    type: array
                    items: { type: string }
                  observed:
                    type: array
                    items: { type: string }
                  undeclaredProducers:
                    type: array
                    items: { type: string }
                    description: Observed but not declared.
                  deadDeclaredProducers:
                    type: array
                    items: { type: string }
                    description: Declared but never observed.
                  mismatch: { type: boolean }
        '404':
          description: Event not declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/events/{name}/poison:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    delete:
      tags: [deprecation]
      summary: Clear poison state for an event (wave26-e)
      description: |
        Dismisses the rolling-window poison flag. Note this is **not**
        gated on the event existing: an undeclared name returns 200 with
        `wasPoison: false`.
      responses:
        '200':
          description: |
            Poison state cleared, or there was none to clear
            (`wasPoison: false`).
          content:
            application/json:
              schema:
                type: object
                required: [cleared, wasPoison]
                properties:
                  cleared: { type: string }
                  wasPoison: { type: boolean }
        '404':
          description: |
            The poison detector is not enabled on this deployment — not
            "event not found".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/deprecated:
    get:
      tags: [deprecation]
      summary: List all deprecated events (wave25-a)
      responses:
        '200':
          description: Deprecated events
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, namespace, transport, version, deprecation]
                      properties:
                        name: { type: string }
                        namespace: { type: string }
                        transport: { type: string, enum: [signal, durable, both] }
                        version: { type: integer }
                        deprecation: { $ref: '#/components/schemas/DeprecationInfo' }

  /api/namespaces:
    get:
      tags: [topology]
      summary: List namespaces with event counts (Phase E7)
      responses:
        '200':
          description: Namespace list
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [namespace, eventCount]
                      properties:
                        namespace: { type: string }
                        eventCount: { type: integer }

  /api/namespaces/summary:
    get:
      tags: [topology]
      summary: Namespace rollup summary with optional event list (wave25-b)
      description: |
        One row per namespace, sorted by namespace. A `transport: both`
        declaration counts toward BOTH `signalCount` and `durableCount`,
        so those two need not sum to `eventCount`.
      parameters:
        - in: query
          name: detail
          schema: { type: string, enum: [summary, full] }
          description: |
            When `full`, each namespace row includes its event list. Only
            the exact value `full` is special; every other value —
            including a repeated key — falls back to the summary rows
            without erroring.
      responses:
        '200':
          description: Namespace summary
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [namespace, eventCount, deprecatedCount, producerCount, subscriberCount, signalCount, durableCount]
                      properties:
                        namespace: { type: string }
                        eventCount: { type: integer }
                        deprecatedCount: { type: integer }
                        producerCount: { type: integer }
                        subscriberCount: { type: integer }
                        signalCount: { type: integer }
                        durableCount: { type: integer }
                        events:
                          type: array
                          description: |
                            Present only when `?detail=full`. Sorted by
                            name.
                          items:
                            type: object
                            required: [name, transport, version, deprecated]
                            properties:
                              name: { type: string }
                              transport: { type: string, enum: [signal, durable, both] }
                              version: { type: integer }
                              deprecated: { type: boolean }

  /api/health:
    get:
      tags: [ops]
      summary: Health probe via API prefix (mirrors root /health)
      responses:
        '200':
          description: Healthy or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Unhealthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /api/health/registry:
    get:
      tags: [ops]
      summary: Richer registry health for the dashboard (wave26-b)
      responses:
        '200':
          description: Registry health snapshot
          content:
            application/json:
              schema:
                type: object
                required: [registrySize, namespaceCount, deprecatedCount, orphanCount, capturedAt, signal, durable]
                properties:
                  registrySize: { type: integer }
                  namespaceCount: { type: integer }
                  deprecatedCount: { type: integer }
                  orphanCount: { type: integer }
                  manifestCount:
                    type: [integer, 'null']
                    description: |
                      Always present. `null` when no manifest store is
                      wired, or when reading it threw.
                  signal:
                    $ref: '#/components/schemas/TransportHealth'
                  durable:
                    $ref: '#/components/schemas/TransportHealth'
                  capturedAt: { type: string, format: date-time }

  /api/metrics:
    get:
      tags: [ops]
      summary: Per-event publish-rate metrics via API prefix (wave26-a)
      description: Returns a map of eventName → EventStats for all events with observed activity.
      responses:
        '200':
          description: Metrics map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: '#/components/schemas/EventStats' }

  /api/metrics/history:
    get:
      tags: [ops]
      summary: Per-event publish-rate sparkline history (wave26-a)
      description: |
        Returns up to 60 samples of publish rate per event (one per
        collector tick), keyed by event name.
      parameters:
        - in: query
          name: eventName
          schema: { type: string }
          description: |
            Restrict to one event. Omit for all events. A name with no
            recorded history still yields that key with an empty array,
            rather than an empty object.
      responses:
        '200':
          description: Rate history
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { type: number }
        '400':
          description: Repeated `?eventName=` key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  responses:
    PayloadTooLarge:
      description: |
        Request body exceeded `MAX_REQUEST_BODY_BYTES` (1 MiB). Produced
        by the HTTP transport before the route handler runs, so the body
        is the transport's, not this API's `Error` envelope.

    TooManyStreams:
      description: |
        The process is at its concurrent SSE ceiling
        (`EVENT_CATALOG_MAX_SSE_STREAMS`, default 256). No stream is
        opened; retry or reduce fan-out.
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error: { type: string, enum: [TooManyStreams] }
              message: { type: string }

  schemas:
    EventDeclarationInput:
      type: object
      required: [name, transport, producer]
      properties:
        name:
          type: string
          description: Canonical dot-form event name.
        namespace:
          type: string
          description: |
            Phase E7 — domain namespace for this event (e.g. `pipeline`,
            `ws`, `sfu`). Optional in v0.4; auto-derived from the event
            name's dotted/colon prefix when omitted. Becomes required in
            v0.5.
        schema:
          type: object
          description: JSON Schema (draft-07). Validated via Ajv on publish.
        transport:
          type: string
          enum: [signal, durable, both]
        producer:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        compatibilityMode:
          type: string
          enum: [backward, forward, full, none]
          default: backward
        compatMode:
          type: string
          enum: [off, warn, strict]
          description: Per-event override for the server compat gate.
        channel:
          type: string
          description: Signal-only. Literal channel pattern (function form is library-only).
        discriminator:
          type: object
          required: [field, values]
          properties:
            field: { type: string }
            values:
              type: array
              items: { type: string }
        queue:
          type: string
          description: Durable-only. Override default queue-name derivation.
        retention:
          type: integer
          description: Durable-only. Retention in seconds.
        fifo:
          type: boolean
          description: Durable-only. FIFO ordering (requires partitionKey on the library side).
        dlqAfterAttempts:
          type: integer
          description: Durable-only. Auto-DLQ after this many delivery attempts.
        dlqRetention:
          type: integer
          description: Durable-only. Per-event DLQ TTL in seconds. Overrides the global 30-day default.
        aliases:
          type: array
          items:
            type: object
            required: [name, deprecated]
            properties:
              name: { type: string }
              deprecated:
                type: boolean
                const: true
              until: { type: string, format: date-time }

    RegistryEntry:
      allOf:
        - $ref: '#/components/schemas/EventDeclarationInput'
        - type: object
          required: [version, schemaFingerprint, namespace, compatibilityMode, schemaHistory, subscribers, metadata]
          properties:
            namespace:
              type: string
              description: |
                Phase E7 — always populated by the registry, either from
                the declaration's explicit `namespace` or auto-derived
                from `name`.
            version: { type: integer }
            schemaFingerprint:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: |
                Phase E6 — sha256 of the canonical (sorted-key) schema
                serialization. Identical for shape-identical schemas
                regardless of key order. Consumers cache + compare
                locally to detect drift without a registry round-trip.
            schemaHistory:
              type: array
              items:
                type: object
                properties:
                  version: { type: integer }
                  schema: { type: object }
                  fingerprint:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                    description: |
                      Phase E6.5 — sha256 of the historical schema.
                      Optional on entries written before wave19-h.
                  updatedAt: { type: string, format: date-time }
            subscribers:
              type: array
              items: { type: string }
            metadata:
              type: object
              properties:
                createdAt: { type: string, format: date-time }
                lastPublishedAt:
                  type: [string, 'null']
                  format: date-time
                publishCount: { type: integer }
                errorCount: { type: integer }
            stats:
              oneOf:
                - $ref: '#/components/schemas/EventStats'
                - type: 'null'
              description: |
                `null` for an event the metrics collector has never seen
                (declared but never published). Only present on the
                responses that enrich the entry — `GET /api/events` and
                `GET /api/events/{name}`.

    ExportArchive:
      type: object
      description: |
        The bulk-export archive. Identical for the GET and POST forms of
        `/api/events/bulk/export` — only how the name list reaches the
        server differs.
      required: [eventCount, events, exportedAt]
      properties:
        eventCount:
          type: integer
          description: |
            Size of `events` — the number of names that RESOLVED, not the
            number requested. Undeclared names are skipped silently.
        events:
          type: array
          items: { $ref: '#/components/schemas/ExportedEvent' }
        exportedAt: { type: string, format: date-time }

    ExportedEvent:
      type: object
      description: |
        The reduced entry shape emitted by the `/api/events/bulk/export`
        routes.
        Deliberately not a `RegistryEntry`: subscribers, schema history,
        compatibility mode, metadata and stats are all omitted.
      required: [name, namespace, transport, producer, version, schemaFingerprint, schema]
      properties:
        name: { type: string }
        namespace: { type: string }
        transport: { type: string, enum: [signal, durable, both] }
        producer:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        version: { type: integer }
        schemaFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        schema: { type: object }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        deprecation: { $ref: '#/components/schemas/DeprecationInfo' }

    BulkDeprecateResult:
      type: object
      required: [deprecated, notFound, total]
      properties:
        deprecated:
          type: array
          items: { type: string }
        notFound:
          type: array
          items: { type: string }
        total:
          type: integer
          description: Size of `deprecated` — NOT the number of names submitted.

    TransportHealth:
      type: object
      required: [status, latencyMs]
      properties:
        status: { type: string, enum: [connected, degraded, disconnected] }
        latencyMs:
          type: number
          description: Round-trip of the probe; 0 when never connected.

    EventEnvelope:
      type: object
      required: [eventName, payload, metadata]
      properties:
        eventName: { type: string }
        payload: {}
        metadata:
          type: object
          required: [id, producer, timestamp]
          properties:
            id: { type: string, description: ULID }
            producer: { type: string }
            timestamp: { type: integer, description: ms since epoch }
            correlationId: { type: string }
            headers:
              type: object
              additionalProperties: { type: string }

    EventStats:
      type: object
      required: [publishCount, publishRate, lastPublishedAt, errorCount, subscriberCount]
      properties:
        publishCount: { type: integer }
        publishRate: { type: number }
        lastPublishedAt:
          type: [string, 'null']
        errorCount: { type: integer }
        subscriberCount: { type: integer }
        queueDepth:
          type: integer
          description: Durable gauges — omitted entirely when the value is 0.
        messagesInFlight:
          type: integer
          description: Durable gauge — omitted entirely when the value is 0.
        oldestMessageAge:
          type: integer
          description: Durable gauge — omitted entirely when the value is 0.

    TopologyGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, type, metadata]
            properties:
              id:
                type: string
                description: The event name for `event` nodes, the service name for `service` nodes.
              type: { type: string, enum: [service, event] }
              metadata:
                type: object
                description: |
                  Always present; an empty object on `service` nodes.
                properties:
                  transport:
                    type: string
                    enum: [signal, durable, both]
                    description: '`event` nodes only.'
                  description:
                    type: string
                    description: '`event` nodes only; absent when the declaration has none.'
                  namespace:
                    type: string
                    description: |
                      Phase E7/E8.4 — `event` nodes only. The admin
                      TopologyView and FlowView build their namespace
                      `<select>` from this, and NamespaceClusters draws
                      the cluster overlay from it.
        edges:
          type: array
          items:
            type: object
            required: [from, to, relation]
            properties:
              from: { type: string }
              to: { type: string }
              relation: { type: string, enum: [publishes, subscribes] }

    HealthResponse:
      type: object
      description: |
        Body of `GET /api/health` only. The root `GET /health` returns
        `ServiceHealthResponse` instead.
      required: [status, redis, messageQueue, uptime, eventCount]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: |
            `unhealthy` (HTTP 503) when either dependency is
            `disconnected`; `degraded` when either is `degraded`.
        redis: { $ref: '#/components/schemas/TransportHealth' }
        messageQueue: { $ref: '#/components/schemas/TransportHealth' }
        uptime: { type: integer, description: seconds since process start }
        eventCount: { type: integer }

    ServiceHealthResponse:
      type: object
      description: |
        Body of the root `GET /health` — the service-runtime tri-state
        shape produced by `makeHealthHandler` (`src/server/health.ts`).
      required: [service, version, status, checks, timestamp]
      properties:
        service: { type: string, enum: [event-catalog] }
        version:
          type: string
          description: Service version read at boot from package.json.
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: |
            Roll-up of `checks`: any unhealthy ⇒ unhealthy (HTTP 503),
            else any degraded ⇒ degraded, else healthy.
        checks:
          type: array
          items:
            type: object
            required: [id, status, durationMs]
            properties:
              id: { type: string, enum: [redis, message-queue, registry] }
              status: { type: string, enum: [healthy, degraded, unhealthy] }
              durationMs: { type: integer }
              details:
                description: |
                  Per-check payload — `{ latencyMs }` for the transports,
                  `{ eventCount }` for the registry, `{ error }` when the
                  check threw or timed out (5s).
        timestamp: { type: string, format: date-time }

    CompatCheckResponse:
      type: object
      required: [eventName, currentVersion, compatibilityMode, compatible, violations]
      properties:
        eventName: { type: string }
        currentVersion: { type: integer }
        compatibilityMode:
          type: string
          enum: [backward, forward, full, none]
        compatible: { type: boolean }
        violations:
          type: array
          items: { type: string }

    DlqEntry:
      type: object
      description: |
        One dead-lettered message, in the single shape the DLQ list
        serves regardless of which source answered
        (`toDlqWireEntry` in `src/server/dlq-store.ts`).

        Both the DynamoDB-backed `DLQStore` and the in-process mirror
        (`DurableTransport.getDLQ()`) are normalized into this; the
        mirror's `messageId`/`envelope`/`deadLetteredAt` are mapped onto
        `id`/`eventName`+`payload`/`deadAt`. The response's top-level
        `source` says which answered, but the entries no longer differ.

        The DynamoDB composite key (`pk`/`sk`) is not on the wire — it is
        a storage detail, and re-derivable as `DLQ#<eventName>` /
        `<deadAt>#<id>`. The `ttl` attribute is surfaced as `expiresAt`.
      required: [id, eventName, payload, error, attempts, deadAt]
      properties:
        id:
          type: string
          description: |
            Entry id — the value accepted by the delete and replay
            routes, and reused as the replayed envelope's
            `metadata.id` (idempotency key).
        eventName: { type: string }
        payload: {}
        error:
          type: string
          description: Why the message was dead-lettered.
        attempts:
          type: integer
          description: Delivery attempts made before dead-lettering.
        deadAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: |
            When the answering source expires the entry (from the
            DynamoDB row's TTL). Absent for in-memory entries, which
            have no expiry — they live until the process restarts or
            the bounded ring evicts them.

    ConsumerManifest:
      type: object
      required: [consumerName, events, updatedAt]
      properties:
        consumerName: { type: string }
        events:
          type: array
          items:
            type: object
            required: [name, fingerprint]
            properties:
              name: { type: string }
              fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        updatedAt: { type: string, format: date-time }

    ManifestDriftReport:
      type: object
      required: [consumerName, updatedAt, events, summary]
      properties:
        consumerName: { type: string }
        updatedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              pinnedFingerprint: { type: string }
              currentFingerprint: { type: [string, 'null'] }
              status:
                type: string
                enum: [fresh, stale, unknown]
        summary:
          type: object
          properties:
            fresh: { type: integer }
            stale: { type: integer }
            unknown: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object

    CompatViolationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, eventName, violations, currentFingerprint, proposedFingerprint]
          properties:
            code: { type: string, enum: [COMPAT_VIOLATION] }
            eventName: { type: string }
            violations:
              type: array
              items: { type: string }
            currentFingerprint:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Phase E6 — fingerprint of the schema currently stored in the registry.
            proposedFingerprint:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Phase E6 — fingerprint of the schema the caller tried to declare.

    PinnedConsumerBreakError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, eventName, currentFingerprint, proposedFingerprint, affectedConsumers]
          properties:
            code: { type: string, enum: [PINNED_CONSUMER_BREAK] }
            eventName: { type: string }
            currentFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
            proposedFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
            affectedConsumers:
              type: array
              items:
                type: object
                properties:
                  consumerName: { type: string }
                  pinnedFingerprint: { type: string }

    DeprecationInfo:
      type: object
      required: [deprecatedAt]
      properties:
        deprecatedAt: { type: string, format: date-time }
        reason: { type: string }
        by: { type: string }

    PoisonState:
      type: object
      required: [eventName, failuresInWindow, poisonedAt, threshold, windowMs]
      properties:
        eventName: { type: string }
        failuresInWindow: { type: integer }
        poisonedAt: { type: string, format: date-time }
        threshold: { type: integer }
        windowMs: { type: integer }
