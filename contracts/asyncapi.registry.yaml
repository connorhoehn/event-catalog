servers:
  signalRedis:
    host: "{redisHost}:{redisPort}"
    protocol: redis
    description: 'Redis pub/sub — the ephemeral "signal" transport. A signal event is fire-and-forget: no persistence, no retry, no delivery guarantee. Subscribers that are not connected at publish time never see the message. Configured via REDIS_URL.'
    variables:
      redisHost:
        default: localhost
        description: Redis host from REDIS_URL.
      redisPort:
        default: "6379"
        description: Redis port from REDIS_URL.
  durableMessageQueue:
    host: "{messageQueueHost}"
    protocol: http
    protocolVersion: "1.1"
    pathname: /api/v1/queues
    description: The @connorhoehn/message-queue service — the persisted, retryable "durable" transport. Producers POST an envelope to /api/v1/queues/{queue}/messages; consumers long-poll the same queue. Messages survive a consumer restart and dead-letter after the declared attempt budget. Configured via MESSAGE_QUEUE_URL.
    variables:
      messageQueueHost:
        default: localhost:3004
        description: message-queue host:port from MESSAGE_QUEUE_URL.
