  schemas:
    pipeline_approval_requested__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        stepId:
          type: string
          description: Identifier of the pipeline step this event belongs to (node id within the pipeline graph).
        approvers:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - user
                  - role
                description: Whether this approver is an individual user or a role/team.
              value:
                type: string
                description: The user id or role name this approver resolves to.
              userId:
                type: string
                description: Convenience alias for `value` when type is `user`; populated by UI surfaces that filter approval queues by user identity.
            required:
              - type
              - value
            additionalProperties: true
          minItems: 1
          description: "Approver descriptors eligible to act on this gate — `{type: user|role, value}`, NOT bare user ids. At least one. This is the field PipelineExecutor actually sends."
        at:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the producer emitted this event.
        approverIds:
          type: array
          items:
            type: string
          minItems: 1
          description: User ids of every approver eligible to act on this gate. At least one. NEVER EMITTED — PipelineExecutor sends `approvers`.
        requestedAt:
          type: number
          description: Epoch milliseconds at which the approval was requested. NEVER EMITTED — PipelineExecutor sends an ISO `at`.
      required:
        - runId
        - stepId
      additionalProperties: true
    pipeline_approval_recorded__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        stepId:
          type: string
          description: Identifier of the pipeline step this event belongs to (node id within the pipeline graph).
        userId:
          type: string
          description: Platform user id of the acting or referenced user.
        at:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the producer emitted this event.
        reason:
          type: string
          description: Why the reported outcome happened.
        approver:
          type: string
          description: User id of the approver who recorded this decision. NEVER EMITTED — PipelineExecutor sends `userId`; kept declared because removal is breaking.
        decision:
          type: string
          enum:
            - approve
            - reject
          description: The recorded outcome of the approval.
        comment:
          type: string
          description: Optional free-text reviewer note attached to the decision.
        decidedAt:
          type: number
          description: Epoch milliseconds at which the approver recorded the decision. NEVER EMITTED — PipelineExecutor sends an ISO `at`.
      required:
        - runId
        - stepId
        - decision
      additionalProperties: true
    pipeline_approval_resolved__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        stepId:
          type: string
          description: Identifier of the pipeline step this event belongs to (node id within the pipeline graph).
        approvalId:
          type: string
          description: Identifier of the approval gate that was resolved.
        decision:
          type: string
          enum:
            - approved
            - rejected
          description: The recorded outcome of the approval.
        by:
          type: string
          description: User ID of the deciding (last) approver
        reason:
          type: string
          description: Optional human-readable rationale
        resolvedAt:
          type: number
          description: Epoch milliseconds at which the gate reached its final decision.
      required:
        - runId
        - stepId
        - approvalId
        - decision
        - by
        - resolvedAt
      additionalProperties: true
    pipeline_run_checkpoint__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        context:
          type: object
          additionalProperties: true
          description: Execution context of the run at the moment of the snapshot.
        currentStepIds:
          type: array
          items:
            type: string
          description: Step ids on the run frontier — the steps in flight when the checkpoint was taken.
        sequenceNumber:
          type: number
          description: Monotonic sequence number of this snapshot within the run.
        at:
          type: string
          description: ISO-8601 timestamp at which the producer emitted this event.
          format: date-time
      required:
        - runId
        - context
        - currentStepIds
        - sequenceNumber
        - at
      additionalProperties: true
    pipeline_run_cancelled__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        at:
          type: string
          description: ISO-8601 timestamp
          format: date-time
      required:
        - runId
        - at
      additionalProperties: true
    pipeline_run_paused__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        at:
          type: string
          description: ISO-8601 timestamp
          format: date-time
        atStepIds:
          type: array
