        producerId:
          type: string
          description: Identifier of the mediasoup Producer (one media track from one participant).
      required:
        - channelArn
        - kind
        - producerId
      additionalProperties: false
    sfu_stream_health_degraded__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        reasons:
          type: array
          items:
            type: string
          minItems: 1
          description: Which health predicates tripped, e.g. `bitrate_drop_40pct`, `low_fps_12`, `keyframe_gap_6.5s`. Never empty.
        bitrateBps:
          type: integer
          minimum: 0
          description: Aggregate inbound bitrate across the channel's producers, in bits per second.
        fps:
          type:
            - number
            - "null"
          description: Lowest frames-per-second observed across the channel's video producers; null when no video producer is publishing.
        keyframeGapSec:
          type:
            - number
            - "null"
          description: Longest observed gap between keyframes, in seconds; null when no gap has been measured.
      required:
        - channelArn
        - reasons
        - bitrateBps
        - fps
        - keyframeGapSec
      additionalProperties: false
    sfu_stream_health_recovered__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        bitrateBps:
          type: integer
          minimum: 0
          description: Aggregate inbound bitrate across the channel's producers, in bits per second.
        fps:
          type:
            - number
            - "null"
          description: Lowest frames-per-second observed across the channel's video producers; null when no video producer is publishing.
      required:
        - channelArn
        - bitrateBps
        - fps
      additionalProperties: false
    sfu_stream_thumbnail_updated__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        path:
          type: string
          description: Storage-relative key of the written thumbnail file.
        sizeBytes:
          type: integer
          minimum: 0
          description: Encoded size of the thumbnail image in bytes.
      required:
        - channelArn
        - path
        - sizeBytes
      additionalProperties: false
    sfu_recording_started__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        recordingId:
          type: string
          description: Identifier of the recording.
        startedAt:
          type: string
          description: ISO-8601 timestamp at which the recording session opened.
          format: date-time
        destination:
          type: string
          description: Recording storage backend the segments were written to. `local` and `s3` are the two platform-api recognises; any other value is persisted as `local`.
        legCount:
          type: integer
          minimum: 0
          description: Number of per-participant recording legs opened. Present only on the per-peer recording path.
      required:
        - channelArn
        - recordingId
        - startedAt
        - destination
      additionalProperties: false
    sfu_recording_completed__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        recordingId:
          type: string
          description: Identifier of the recording.
        segments:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Storage key of this segment, relative to the recording bucket.
              url:
                type: string
                description: Fetchable URL of this segment.
                format: uri
              size:
                type: integer
                minimum: 0
                description: Encoded size of this segment in bytes.
            required:
              - key
              - url
              - size
            additionalProperties: false
          description: Ordered manifest of the written recording segments. Empty in multi-leg mode, where `tracks` is the real manifest and `composedUrl` is the playback target.
        totalSize:
          type: integer
          minimum: 0
          description: Sum of every written segment's encoded size, in bytes.
        durationMs:
          type: integer
          minimum: 0
          description: Wall-clock duration in milliseconds.
        destination:
          type: string
          description: Recording storage backend the segments were written to. `local` and `s3` are the two platform-api recognises; any other value is persisted as `local`.
        thumbnailUrl:
          type: string
          description: Poster-frame URL for the finished recording. Absent when no thumbnail was captured.
          format: uri
        composedUrl:
          type: string
          description: "Playback URL of the composed single-file render. NEVER EMITTED as of 2026-09-07: LVS assigns it nowhere, because compose runs as a background job after this webhook fires and writes `composedSegment` instead. platform-api reads it and gets undefined. Kept because removing a property is a breaking schema change; the field should go once a compose-completion contract exists."
          format: uri
        tracks:
          type: array
          items:
            type: object
            properties:
              participantId:
                type: string
                description: SFU wire participant id of the speaker/participant.
              userId:
                type: string
                description: 'Platform user id of the participant this leg belongs to. NEVER EMITTED as of 2026-09-07, and the second instance of the `composedUrl` defect: `record.tracks` has exactly one writer (RecordingManager.js:1516, from the literal at :1493) and it enumerates legId, participantId, the two producer ids, file, key, url, size, the timestamps, endReason, durationMs, kind and repair — no userId, no spread; the whole recording subsystem never touches the identifier. platform-api reads it in two places (lib/recording-truth.ts:222 and :250), and the :250 branch — "recorded legs that carry a userId are participants even when the live roster dropped them" — is therefore unreachable, which is exactly the leaver it was written to recover. Kept because removing a property is a breaking schema change; it should go, or LVS should start sending it.'
              key:
                type:
                  - string
                  - "null"
                description: Storage key of this participant's track, relative to the recording bucket. Null when the leg was never uploaded.
              url:
                type:
                  - string
                  - "null"
                description: Fetchable URL of this participant's track. Null when the leg was neither uploaded nor written locally.
                format: uri
              size:
                type: integer
                minimum: 0
                description: Encoded size of this track in bytes.
              kind:
                type: string
                description: Media kind of this leg — `av` when the participant published both audio and video.
            required:
              - participantId
              - kind
            additionalProperties: true
          description: Per-participant raw track manifest — the download and transcription view, as opposed to the composed playback render. Absent on the single-file path.
        recordingProfile:
          type: string
          description: Canonical recording-shape identifier (see recording-profiles.ts). Consumers branch on this instead of re-reading channel config.
        profileVersion:
          type: number
          description: Recording-profile registry version in force when the recording STARTED, so an in-flight recording finalizes under the semantics it began with.
        composePerPeer:
          type: boolean
          description: Legacy denormalization of the profile's compose-per-peer flag, kept for one release window while consumers migrate to `recordingProfile`.
        transcribe:
          type: boolean
          description: Legacy denormalization of the profile's transcribe flag, kept for one release window while consumers migrate to `recordingProfile`.
      required:
        - channelArn
        - recordingId
        - segments
        - totalSize
        - durationMs
        - destination
        - recordingProfile
        - profileVersion
        - composePerPeer
        - transcribe
      additionalProperties: false
    sfu_channel_created__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        name:
          type: string
          description: Human-readable channel name supplied at creation.
        type:
          type: string
          description: Channel quality tier — STANDARD, BASIC, ADVANCED_HD or ADVANCED_SD. Defaults to STANDARD when the create request omits it.
      required:
        - channelArn
        - name
        - type
      additionalProperties: false
    sfu_channel_updated__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        field:
          type: string
          description: Which channel configuration field was mutated. `recordingConfiguration` and `webhookUrl` are the two the API mutates today.
      required:
        - channelArn
        - field
      additionalProperties: false
    sfu_channel_deleted__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
      required:
        - channelArn
      additionalProperties: false
    sfu_producer_added__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        producerId:
          type: string
          description: Identifier of the mediasoup Producer (one media track from one participant).
        kind:
          type: string
          enum:
            - audio
            - video
          description: Media kind the track carries.
        participantId:
          type: string
          description: SFU wire participant id of the speaker/participant.
        displayName:
          type: string
          description: Human-readable display name shown in the UI.
        userId:
          type: string
          description: Platform user id of the acting or referenced user.
        isPiped:
          type: boolean
          description: Whether this producer arrived by accepting a mesh pipe from another pod rather than being created locally. Always false on the stream-events bus today — cross-pod pipes are announced on MeshPipeManager's own `producerPiped` signal, which does not reach this bus.
        state:
          type: object
          properties:
            muted:
              type: boolean
              description: Whether the producer is currently muted.
          required:
            - muted
          additionalProperties: true
          description: Runtime producer state. Present only on the create-producer API path.
      required:
        - channelArn
        - producerId
        - kind
        - isPiped
      additionalProperties: false
    sfu_producer_removed__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        producerId:
          type: string
          description: Identifier of the mediasoup Producer (one media track from one participant).
        kind:
          type: string
          enum:
            - audio
            - video
          description: Media kind the track carries.
        participantId:
          type: string
          description: SFU wire participant id of the speaker/participant.
      required:
        - channelArn
        - producerId
        - kind
      additionalProperties: false
    sfu_recording_state_changed__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        isRecording:
          type: boolean
          description: Whether recording is now active on the channel — true on start, false on stop or prune.
        recordingId:
          type: string
          description: Identifier of the recording.
        startedAt:
          type: string
          description: ISO-8601 timestamp at which the recording session opened.
          format: date-time
        pruned:
          type: boolean
          description: Present and true only when the recording was discarded at finalize because it captured no tracks.
        reason:
          type: string
          description: Why the reported outcome happened.
      required:
        - channelArn
        - isRecording
      additionalProperties: false
    sfu_producer_state_changed__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        producerId:
          type: string
          description: Identifier of the mediasoup Producer (one media track from one participant).
        participantId:
          type: string
          description: SFU wire participant id of the speaker/participant.
        kind:
          type:
            - string
            - "null"
          enum:
            - audio
            - video
            - null
          description: Media kind the track carries; null when the room's producer index has no kind recorded for it.
        state:
          type: object
          properties:
            muted:
              type: boolean
              description: Whether the producer is currently muted.
          required:
            - muted
          additionalProperties: true
          description: "The FULL merged runtime state after the patch, not just the changed keys — `{ ...current, ...patch }`. Open on purpose: `muted` is the only mutable field today (PATCH_FIELDS, producerState.js:33) and more may be added."
      required:
        - channelArn
        - producerId
        - participantId
        - kind
        - state
      additionalProperties: false
    sfu_participant_disconnected__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        participantId:
          type: string
          description: SFU wire participant id of the speaker/participant.
        reason:
          type: string
          description: Why the reported outcome happened.
        source:
          type: string
          enum:
            - admin-disconnect
            - denylist
          description: Which subsystem initiated the disconnect, and therefore which fields to expect.
        transportId:
          type: string
          description: Identifier of the mediasoup WebRTC transport the ops endpoint was asked to close.
      required:
        - channelArn
        - participantId
        - reason
        - source
      additionalProperties: false
    sfu_member_owner_changed__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        memberId:
          type: string
          description: Deterministic member identity from the stage-WS token's `mid` claim. Stable across a person's browser tabs, unlike `participantId`, which is per-tab.
        userId:
          type: string
          description: Platform user id of the acting or referenced user.
        ownerClientId:
          type:
            - string
            - "null"
          description: Client id currently holding the per-member owner lock; null when no session store is wired to arbitrate, in which case every tab treats itself as the owner.
        participantId:
          type:
            - string
            - "null"
          description: Per-tab participant id of the tab this frame is about, aliased alongside `memberId` so legacy listeners can still tell which tab owns the member without speaking the `mid` vocabulary. Null when the subscribe frame carried no participantId.
      required:
        - channelArn
        - memberId
        - ownerClientId
        - participantId
      additionalProperties: false
    sfu_chat_event__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        eventName:
          type: string
          minLength: 1
          maxLength: 64
          description: Caller-defined name of the custom chat event. At most 64 characters, never empty.
        attributes:
          type: object
          additionalProperties: true
          description: Free-form attributes supplied with the event. The endpoint enforces at most 10 keys, each key and each value a string of at most 256 characters, and substitutes `{}` when the caller omits the field — so this is never absent and never null.
        publishedAt:
          type: string
          description: ISO-8601 timestamp at which the SFU accepted and published the event.
          format: date-time
      required:
        - channelArn
        - eventName
        - attributes
        - publishedAt
      additionalProperties: false
    sfu_participant_left__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        participantId:
          type: string
          description: Per-tab participant id of the departed participant — the room-scoped id, never a `:screen` sub-identity, which the bridge filters out before emitting.
      required:
        - channelArn
        - participantId
      additionalProperties: false
    sfu_recording_compose_queued__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        recordingId:
          type: string
          description: Identifier of the recording.
        legCount:
          type: integer
          minimum: 1
          description: Number of per-participant legs the recording captured, and therefore the number of compose candidates. The emit is gated on this being at least 1.
        durationMs:
          type: integer
          minimum: 0
          description: Wall-clock duration in milliseconds.
        recordingStartedAt:
          type: string
          description: ISO-8601 timestamp at which the recording being composed originally opened.
          format: date-time
      required:
        - channelArn
        - recordingId
        - legCount
        - durationMs
        - recordingStartedAt
      additionalProperties: false
    sfu_recording_compose_started__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        recordingId:
          type: string
          description: Identifier of the recording.
        jobId:
          type: string
          description: Identifier of this compose attempt. Absent only when runComposeJob is invoked directly without one — both production enqueue paths always mint it.
      required:
        - channelArn
        - recordingId
      additionalProperties: false
    sfu_recording_compose_progress__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        recordingId:
          type: string
          description: Identifier of the recording.
        jobId:
          type: string
          description: Identifier of this compose attempt. Absent only when runComposeJob is invoked directly without one — both production enqueue paths always mint it.
        progressPct:
          type: integer
          minimum: 0
          maximum: 99
          description: Elapsed output time as a whole percentage of the planned duration, hard-capped at 99 by the producer so a progress bar never claims completion the compose has not reached.
      required:
        - channelArn
        - recordingId
        - progressPct
      additionalProperties: false
    sfu_recording_compose_failed__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        recordingId:
          type: string
          description: Identifier of the recording.
        jobId:
          type: string
          description: Identifier of this compose attempt. Absent only when runComposeJob is invoked directly without one — both production enqueue paths always mint it.
        wallMs:
          type: integer
          minimum: 0
          description: Wall-clock milliseconds the compose job had been running when this event fired.
        reason:
          type: string
          description: Why the reported outcome happened.
        stage:
          type: string
          description: Which stage of the windowed pre-pass threw. Present ONLY on the pre-pass failure path; defaults to `prepass` when the thrown error names none.
        exitCode:
          type: integer
          description: ffmpeg process exit code, or -1 when the process could not be spawned at all. Present ONLY on the ffmpeg failure path.
      required:
        - channelArn
        - recordingId
        - wallMs
        - reason
      additionalProperties: false
    sfu_recording_compose_completed__schema:
      type: object
      properties:
        channelArn:
          type: string
          description: SFU channel ARN identifying the video call this event belongs to.
        recordingId:
          type: string
          description: Identifier of the recording.
        jobId:
          type: string
          description: Identifier of this compose attempt. Absent only when runComposeJob is invoked directly without one — both production enqueue paths always mint it.
        wallMs:
          type: integer
          minimum: 0
          description: Wall-clock milliseconds the compose job had been running when this event fired.
        composeStatus:
          type: string
          enum:
            - ok
            - degraded
          description: "`ok` when the muxed output matched the planned duration; `degraded` when ffmpeg exited clean but the probed output is under 90% of it — a truncated tail. Never `failed`: a failure emits sfu.recording.compose.failed instead."
        composedSegment:
          type: object
          properties:
            key:
              type: string
              description: Storage key of the composed render, relative to the recording bucket.
            url:
              type: string
              description: Fetchable URL of the composed render. A `file://` path to the pod-local copy when no storage backend is wired or the upload failed — check the scheme before handing it to a client.
              format: uri
            size:
              type: integer
              minimum: 0
              description: Encoded size of the composed render in bytes.
            legCount:
              type: integer
              minimum: 0
              description: Number of participant legs actually muxed in — legs skipped at triage are not counted.
            composedAt:
              type: string
              description: ISO-8601 timestamp at which the composed render was written.
              format: date-time
          required:
            - key
            - url
            - size
            - legCount
            - composedAt
          additionalProperties: false
          description: Descriptor of the composed single-file render this job produced.
        outputProbedDurationMs:
          type:
            - number
            - "null"
          description: Duration of the composed output as measured by ffprobe, in milliseconds. Null when probing failed or no ffprobe binary is available — in which case `composeStatus` is graded `ok` on trust.
      required:
        - channelArn
        - recordingId
        - wallMs
        - composeStatus
        - composedSegment
        - outputProbedDurationMs
      additionalProperties: false
    sfu_chat_message__schema:
      type: object
      properties:
        Type:
          type: string
          enum:
            - MESSAGE
          description: IVS Chat wire-protocol frame discriminator. Always `MESSAGE`.
        Id:
          type: string
          description: IVS Chat message id. Also the cross-pod de-duplication key — a pod that published this id skips the echo.
        RequestId:
          type: string
          description: Client-supplied correlation id echoed back so a sender can match the broadcast to its own send. Absent when the sender supplied none.
        Sender:
          type: object
          properties:
            UserId:
              type: string
              description: Platform user id of the sender, or the literal `server` for a server-originated message.
            Attributes:
              type: object
              additionalProperties: true
              description: Free-form sender attributes forwarded verbatim from the authenticated user info.
          required:
            - UserId
            - Attributes
          additionalProperties: true
          description: Who sent the message, in IVS Chat wire shape.
        Content:
          type: string
          description: Message body text.
        Attributes:
          type: object
          additionalProperties: true
          description: Free-form per-message attributes supplied by the sender.
        SendTime:
          type: string
          description: ISO-8601 timestamp at which the message was accepted.
          format: date-time
      required:
        - Type
        - Id
        - Sender
        - Content
        - Attributes
        - SendTime
      additionalProperties: true
    sfu_chat_message_deleted__schema:
      type: object
      properties:
        Type:
          type: string
          enum:
            - MESSAGE_DELETED
          description: IVS Chat wire-protocol frame discriminator. Always `MESSAGE_DELETED`.
        Id:
          type: string
          description: IVS Chat message id. Also the cross-pod de-duplication key — a pod that published this id skips the echo.
        Reason:
          type: string
          description: Moderator-supplied reason. Always present; empty string when none was given.
        DeleteTime:
          type: string
          description: ISO-8601 timestamp at which the message was deleted.
          format: date-time
      required:
        - Type
        - Id
        - Reason
        - DeleteTime
      additionalProperties: true
    sfu_chat_user_disconnected__schema:
      type: object
      properties:
        Type:
          type: string
          enum:
            - USER_DISCONNECTED
          description: IVS Chat wire-protocol frame discriminator. Always `USER_DISCONNECTED`.
        UserId:
          type: string
          description: Platform user id of the affected user.
        Reason:
          type: string
          description: Moderator-supplied reason. Always present; empty string when none was given.
        DisconnectTime:
          type: string
          description: ISO-8601 timestamp at which the user was disconnected.
          format: date-time
      required:
        - Type
        - UserId
        - Reason
        - DisconnectTime
      additionalProperties: true
    sfu_chat_user_banned__schema:
      type: object
      properties:
        type:
          type: string
          enum:
            - user.banned
          description: Chat-bus frame discriminator. Always `user.banned`.
        userId:
          type: string
          description: Platform user id of the acting or referenced user.
        reason:
          type: string
          description: Why the reported outcome happened.
        durationSeconds:
          type:
            - integer
            - "null"
          minimum: 0
          description: How long the ban lasts, in seconds; null for a permanent ban.
      required:
        - type
        - userId
        - reason
        - durationSeconds
      additionalProperties: false
    sfu_chat_user_unbanned__schema:
      type: object
      properties:
        type:
          type: string
          enum:
            - user.unbanned
          description: Chat-bus frame discriminator. Always `user.unbanned`.
        userId:
          type: string
          description: Platform user id of the acting or referenced user.
      required:
        - type
        - userId
      additionalProperties: false
    ag_ui_RUN_STARTED__schema:
      type: object
      required:
        - type
        - threadId
        - runId
      properties:
        type:
          type: string
          const: RUN_STARTED
          description: AG-UI event type discriminator — always the literal name of this event.
        threadId:
          type: string
          description: Identifier of the conversation thread this run belongs to.
        runId:
          type: string
          description: Identifier of the agent run this event belongs to.
      additionalProperties: true
    ag_ui_RUN_FINISHED__schema:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: RUN_FINISHED
          description: AG-UI event type discriminator — always the literal name of this event.
        threadId:
          type: string
          description: "NEVER EMITTED — RUN_STARTED carries the thread identity and neither RUN_FINISHED producer repeats it: AgentStream omits it and platform-api's pipelineLLMStream sends runId only. Correlate on the runId from RUN_STARTED instead. Declared-but-optional only because removing a property is breaking; do not re-add it to `required`."
        runId:
          type: string
          description: Identifier of the agent run that finished. Sent by platform-api's pipelineLLMStream; omitted by AgentStream, which relies on the RUN_STARTED correlation.
        outcome:
          type: string
          description: Caller-supplied summary of how the run ended, when the caller chose to label it. Free-form; AgentStream does not constrain the value.
        result:
          description: Caller-supplied final result of the run. Shape is defined by the agent and deliberately unconstrained.
        timestamp:
          type: number
          description: Epoch milliseconds at which AgentStream emitted the frame (its injectable `now()`, defaulting to Date.now()). Not an ISO string.
      additionalProperties: true
    ag_ui_RUN_ERROR__schema:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          const: RUN_ERROR
          description: AG-UI event type discriminator — always the literal name of this event.
        message:
          type: string
          description: Human-readable error message.
        code:
          type: string
