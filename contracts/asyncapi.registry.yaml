    title: sfu-cluster → sfu.chat.message
    summary: sfu-cluster publishes sfu.chat.message
    description: A chat message was sent by a participant, in IVS Chat wire-protocol shape. Persisted to the per-channel history list before fan-out; republished cross-pod on chat-bus so other pods can broadcast it to their local sockets (chat/ChatHub.js:206).
    tags:
