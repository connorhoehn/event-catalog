    signal__sfu_recording_state_changed__msg:
      name: sfu.recording.state.changed
      title: sfu.recording.state.changed
      description: Recording started or stopped for a channel. Pushed onto the per-channel stream-events bus so stage-WS subscribers can drop their GET /:arn/recording poll. Emitted from recording/RecordingManager.js via _emitStateChange (:501) on start (:948), per-peer start (:2433), stop (:1837) and zero-track prune (:1644).
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: recording
      payload:
        $ref: "#/components/schemas/sfu_recording_state_changed__schema"
    signal__sfu_producer_state_changed__msg:
      name: sfu.producer.state-changed
      title: sfu.producer.state-changed
      description: A producer's runtime state was mutated through PATCH /api/channels/:arn/producers/:producerId/state — force-mute and self-mute both land here. Emitted only when the patch actually changed a field; an idempotent no-op patch takes the else branch and emits nothing (api/channels/producerState.js:214). The wire type is the short form `producer.state-changed`.
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: producer
      payload:
        $ref: "#/components/schemas/sfu_producer_state_changed__schema"
    signal__sfu_participant_disconnected__msg:
      name: sfu.participant.disconnected
      title: sfu.participant.disconnected
      description: "A participant was forcibly disconnected from a channel. Two emit sites, distinguished by `source`: the ops endpoint DELETE /api/admin/channels/:arn/sessions/:transportId (api/admin/disconnect-session.js:100) and the cluster denylist watcher, which fires only once it has actually closed at least one local transport (workers/denyListWatcher.js:100). Clients that receive this event carrying their OWN participantId should treat it as terminal."
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: participant
        - name: moderation
      payload:
        $ref: "#/components/schemas/sfu_participant_disconnected__schema"
    signal__sfu_member_owner_changed__msg:
      name: sfu.member.owner.changed
      title: sfu.member.owner.changed
      description: Server-arbitrated cross-tab ownership was assigned for a member on a channel. The first stage-WS tab to claim the per-member Redis lock becomes the owner; sibling tabs of the same member become silent observers and learn of the assignment from this frame (ws/stageWsServer.js:476). Emitted only for Wave-5+ tokens — a legacy JWT with no `mid` claim never triggers it, which keeps the per-channel eventId sequence stable for older replay-buffer consumers.
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: member
      payload:
        $ref: "#/components/schemas/sfu_member_owner_changed__schema"
    signal__sfu_chat_event__msg:
      name: sfu.chat.event
      title: sfu.chat.event
      description: A custom, application-defined chat event was published into a channel's live event stream via POST /api/channels/:arn/chat/events — the IVS Chat `SendEvent` equivalent (api/channels/chat-events.js:184). Rides the stream-events hub, not the chat-bus, so unlike the sfu.chat.* frames it carries channelArn and is fanned out to stage-WS subscribers and other pods rather than to IVS chat clients.
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: chat
      payload:
        $ref: "#/components/schemas/sfu_chat_event__schema"
    signal__sfu_participant_left__msg:
      name: sfu.participant.left
      title: sfu.participant.left
      description: "A participant is confirmed gone from a channel. Bridged from RoomManager's in-process `participantLeft` EventEmitter onto the stream-events hub at app.js:548 (added 2026-08-22), which is what makes it cross-service: before that bridge a clean leave (WHIP DELETE, admin disconnect, leaveRoom) never left the process and peers' tiles lingered for the full client-side orphan grace. NOT a raw mirror of the emitter — the bridge filters, so this is the DEPARTURE signal rather than the removal signal. Sub-identities ending in `:screen` are dropped entirely (a sharer stopping a screen share is not a departure; subscribers tear that down from `producer.removed`), and a real id is debounced for 1.5s and emitted only if the participant is STILL absent from the room when the timer fires — so camera-off, which unpublishes and immediately republishes audio-only, produces nothing. Consumers treat it as terminal for the participant: lvs-client tears down every subscriber for the id and its `:screen` sibling (packages/lvs-client/src/client.js:1013), and stage-WS suppresses a client's echo of its own departure (ws/stageWsServer.js:207)."
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: participant
      payload:
        $ref: "#/components/schemas/sfu_participant_left__schema"
    signal__sfu_recording_compose_queued__msg:
      name: sfu.recording.compose.queued
      title: sfu.recording.compose.queued
      description: A finalized multi-leg recording was accepted for background composition, before the ffmpeg job starts. Emitted from the tail of finalizeRecording (recording/RecordingManager.js:1662) so a client can show a "Composing…" badge immediately; it is often the FIRST signal the recordings list gets that the row exists at all. Only the per-peer path reaches it — a single-file recording has no legs to compose.
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: recording
        - name: compose
      payload:
        $ref: "#/components/schemas/sfu_recording_compose_queued__schema"
    signal__sfu_recording_compose_started__msg:
      name: sfu.recording.compose.started
      title: sfu.recording.compose.started
      description: The background compose job for a recording began. Emitted on the first line of runComposeJob (recording/RecordingManager.js:3754), before input triage and before ffmpeg is spawned, so it is unconditional for every attempt including the resume sweeper's.
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: recording
        - name: compose
      payload:
        $ref: "#/components/schemas/sfu_recording_compose_started__schema"
    signal__sfu_recording_compose_progress__msg:
      name: sfu.recording.compose.progress
      title: sfu.recording.compose.progress
      description: The running compose job crossed a 10% progress bucket. Derived from ffmpeg's `time=` stderr line and deliberately throttled to one event per bucket (recording/RecordingManager.js:3965), which keeps bus traffic linear in recording count rather than in frame count. A short compose may emit this zero times; it never reports 100 — completion is what `sfu.recording.compose.completed` is for.
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: recording
        - name: compose
      payload:
        $ref: "#/components/schemas/sfu_recording_compose_progress__schema"
    signal__sfu_recording_compose_failed__msg:
      name: sfu.recording.compose.failed
      title: sfu.recording.compose.failed
      description: "The compose job failed and produced no usable output. Two emit sites carry DIFFERENT diagnostic fields: the windowed pre-pass failure (recording/RecordingManager.js:3897) sets `stage`, and the ffmpeg non-zero-exit / missing-output path (:4011) sets `exitCode`. A consumer must branch on which one is present rather than assume either; `reason` is the only human-readable field common to both."
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: recording
        - name: compose
      payload:
        $ref: "#/components/schemas/sfu_recording_compose_failed__schema"
    signal__sfu_recording_compose_completed__msg:
      name: sfu.recording.compose.completed
      title: sfu.recording.compose.completed
      description: The compose job finished and its composed render was uploaded and persisted (recording/RecordingManager.js:4093). This — not the `sfu.recording.completed` webhook — is the event that says a composed playback file exists, because compose runs after that webhook has already fired. `composeStatus` distinguishes a clean render from one ffmpeg exited zero on but that came out materially shorter than planned.
      tags:
        - name: sfu
        - name: producer:sfu-cluster
        - name: control-plane
        - name: recording
        - name: compose
      payload:
        $ref: "#/components/schemas/sfu_recording_compose_completed__schema"
    signal__sfu_chat_message__msg:
      name: sfu.chat.message
      title: sfu.chat.message
      description: A chat message was sent by a participant, in IVS Chat wire-protocol shape. Persisted to the per-channel history list before fan-out; republished cross-pod on chat-bus so other pods can broadcast it to their local sockets (chat/ChatHub.js:206).
