    title: sfu-cluster → sfu.chat.user.banned
    summary: sfu-cluster publishes sfu.chat.user.banned
    description: A user was banned from chat on a channel — internal cross-pod propagation, NOT part of the IVS Chat wire protocol, so the keys are lowercase and no client ever sees it (api/channels/chatBans.js:42).
    tags:
      - name: sfu
      - name: producer:sfu-cluster
