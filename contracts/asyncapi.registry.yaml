    title: sfu-cluster → sfu.chat.message_deleted
    summary: sfu-cluster publishes sfu.chat.message_deleted
    description: A previously sent chat message was deleted by a moderator, in IVS Chat wire-protocol shape (chat/ChatHub.js:226).
    tags:
      - name: sfu
      - name: producer:sfu-cluster
      - name: chat
      - name: moderation
      - name: ivs-parity
  signal__sfu_chat_user_disconnected__send_by__sfu_cluster:
    action: send
    channel:
      $ref: "#/channels/signal__sfu_chat_user_disconnected"
    messages:
      - $ref: "#/channels/signal__sfu_chat_user_disconnected/messages/signal__sfu_chat_user_disconnected__msg"
    title: sfu-cluster → sfu.chat.user_disconnected
    summary: sfu-cluster publishes sfu.chat.user_disconnected
    description: A user was forcibly disconnected from a chat channel by a moderator, in IVS Chat wire-protocol shape. Subscribing pods close any local sockets held by the named user (producer chat/ChatHub.js:238; the cross-pod consumer is chat/ChatHub.js:137).
    tags:
      - name: sfu
      - name: producer:sfu-cluster
      - name: chat
      - name: moderation
      - name: ivs-parity
  signal__sfu_chat_user_banned__send_by__sfu_cluster:
    action: send
    channel:
