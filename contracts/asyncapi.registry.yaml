    pipeline_step_agent_tool__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        stepId:
          type: string
          description: Identifier of the pipeline step this event belongs to (node id within the pipeline graph).
        callIndex:
          type: number
          description: Zero-based index of this tool call within the agent loop; correlation key against the persisted AgentStepOutput.toolCalls[].
        name:
          type: string
          description: Tool name (e.g. Read, Grep).
        phase:
          type: string
          enum:
            - start
            - end
          description: "Lifecycle phase: 'start' opens the call, 'end' closes it."
        ok:
          type: boolean
          description: Present on phase 'end' only — whether the tool call succeeded.
        at:
          type: string
          description: ISO-8601 timestamp.
          format: date-time
      required:
        - runId
        - stepId
        - callIndex
        - name
        - phase
        - at
      additionalProperties: true
    pipeline_step_fanout__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        stepId:
          type: string
          description: Identifier of the scatter SOURCE node — the step whose handler returned `fanOut`. Arm steps carry `<stepId>:<armIndex>` instead.
        count:
          type: integer
          minimum: 0
          description: Number of arms dispatched (`fanOut.items.length`). Folded onto the source step as `fanoutCount` by the run-detail reducer.
        at:
          type: string
          description: ISO-8601 timestamp at which the executor dispatched the arms.
          format: date-time
      required:
        - runId
        - stepId
        - count
        - at
      additionalProperties: true
    pipeline_step_image_produced__schema:
      type: object
      properties:
        runId:
          type: string
          description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
        stepId:
          type: string
          description: Identifier of the pipeline step this event belongs to (node id within the pipeline graph).
        imageId:
          type: string
          description: Identifier of the image in the ImageBlobStore. The dedup key the run-detail reducer uses.
        width:
          type: integer
          description: Width of the produced image in pixels, from the blob store metadata.
        height:
          type: integer
          description: Height of the produced image in pixels, from the blob store metadata.
        mimeType:
          type: string
          description: IANA media type of the uploaded file.
        bbox:
          type: object
          description: Crop rectangle in SOURCE-image coordinates. Emitted by the crop handler alone; absent on every other producer.
          properties:
            x:
              type: number
              description: Left edge of the crop rectangle, in source-image pixels.
            y:
              type: number
              description: Top edge of the crop rectangle, in source-image pixels.
            width:
              type: number
              description: Width of the crop rectangle, in source-image pixels.
            height:
              type: number
              description: Height of the crop rectangle, in source-image pixels.
          required:
            - x
            - y
            - width
            - height
          additionalProperties: true
        at:
          type: string
          description: ISO-8601 timestamp at which the handler announced the artifact.
          format: date-time
      required:
        - runId
        - stepId
        - imageId
        - width
        - height
        - mimeType
        - at
      additionalProperties: true
    activity_recorded__schema:
      type: object
      properties:
        eventType:
          type: string
          minLength: 1
          description: Activity sub-type naming what the user did (e.g. `doc.created`, `post.liked`). Doubles as the pipeline-trigger key on the consumer side.
        detail:
          type: object
          additionalProperties: true
          description: Free-form application detail attached to the activity entry.
        timestamp:
          type: string
          description: ISO-8601 timestamp at which the producer emitted this event.
          format: date-time
        userId:
          type:
            - string
            - "null"
          description: Platform user id of the acting user, resolved server-side from the connection's authenticated context. Explicitly `null` for an anonymous or unresolvable sender.
        displayName:
          type: string
          description: Human-readable sender name stamped alongside `userId`. Falls back to the user id, then to the literal `anonymous`.
      required:
        - eventType
        - detail
        - timestamp
        - userId
        - displayName
      additionalProperties: true
    call_reaction_recorded__schema:
      type: object
      properties:
        reactionId:
          type: string
          minLength: 1
          description: Gateway-minted id, unique per reaction. The idempotency key consumers de-duplicate re-deliveries on.
        channel:
          type: string
          pattern: "^call:"
          description: Gateway reaction channel the reaction was thrown in. Always `call:`-prefixed — the durable tap fires for in-call reactions only.
        lobbyName:
          type: string
          description: Real lobby name the reaction belongs to. Taken from the sender's `metadata.lobbyName` when present, else the `call:` prefix stripped off `channel`; the former is authoritative because the frontend hashes over-long channel names.
        userId:
          type:
            - string
            - "null"
          description: Platform user id of the acting user, resolved server-side from the connection's authenticated context. Explicitly `null` for an anonymous or unresolvable sender.
        displayName:
          type: string
          description: Human-readable sender name stamped alongside `userId`. Falls back to the user id, then to the literal `anonymous`.
        emoji:
          type: string
          minLength: 1
          description: Single emoji character carried by the reaction.
        effect:
          type: string
          description: Visual effect the client plays with the reaction (confetti, burst, …), resolved server-side from the channel's available-reactions catalog.
        at:
          type: string
          description: ISO-8601 timestamp at which the producer emitted this event.
          format: date-time
      required:
        - reactionId
        - channel
        - lobbyName
        - userId
        - emoji
        - at
      additionalProperties: true
    sfu_session_created__schema:
      type: object
      properties:
