    summary: sfu-cluster publishes sfu.chat.user.unbanned
    description: A previously banned user was unbanned — internal cross-pod propagation, lowercase keys, no client visibility (api/channels/chatBans.js:90).
    tags:
      - name: sfu
      - name: producer:sfu-cluster
      - name: chat
      - name: moderation
      - name: internal
