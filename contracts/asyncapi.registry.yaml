    address: stream-events
    title: sfu.participant.left
    description: "A participant is confirmed gone from a channel. Bridged from RoomManager's in-process `participantLeft` EventEmitter onto the stream-events hub at app.js:548 (added 2026-08-22), which is what makes it cross-service: before that bridge a clean leave (WHIP DELETE, admin disconnect, leaveRoom) never left the process and peers' tiles lingered for the full client-side orphan grace. NOT a raw mirror of the emitter — the bridge filters, so this is the DEPARTURE signal rather than the removal signal. Sub-identities ending in `:screen` are dropped entirely (a sharer stopping a screen share is not a departure; subscribers tear that down from `producer.removed`), and a real id is debounced for 1.5s and emitted only if the participant is STILL absent from the room when the timer fires — so camera-off, which unpublishes and immediately republishes audio-only, produces nothing. Consumers treat it as terminal for the participant: lvs-client tears down every subscriber for the id and its `:screen` sibling (packages/lvs-client/src/client.js:1013), and stage-WS suppresses a client's echo of its own departure (ws/stageWsServer.js:207)."
    servers:
      - $ref: "#/servers/signalRedis"
    messages:
      signal__sfu_participant_left__msg:
        $ref: "#/components/messages/signal__sfu_participant_left__msg"
    bindings:
      redis: {}
    x-event-catalog-transport: signal
  signal__sfu_recording_compose_queued:
    address: stream-events
    title: sfu.recording.compose.queued
    description: A finalized multi-leg recording was accepted for background composition, before the ffmpeg job starts. Emitted from the tail of finalizeRecording (recording/RecordingManager.js:1662) so a client can show a "Composing…" badge immediately; it is often the FIRST signal the recordings list gets that the row exists at all. Only the per-peer path reaches it — a single-file recording has no legs to compose.
    servers:
      - $ref: "#/servers/signalRedis"
    messages:
      signal__sfu_recording_compose_queued__msg:
        $ref: "#/components/messages/signal__sfu_recording_compose_queued__msg"
    bindings:
      redis: {}
    x-event-catalog-transport: signal
  signal__sfu_recording_compose_started:
    address: stream-events
    title: sfu.recording.compose.started
    description: The background compose job for a recording began. Emitted on the first line of runComposeJob (recording/RecordingManager.js:3754), before input triage and before ffmpeg is spawned, so it is unconditional for every attempt including the resume sweeper's.
    servers:
      - $ref: "#/servers/signalRedis"
    messages:
      signal__sfu_recording_compose_started__msg:
        $ref: "#/components/messages/signal__sfu_recording_compose_started__msg"
    bindings:
      redis: {}
    x-event-catalog-transport: signal
  signal__sfu_recording_compose_progress:
    address: stream-events
    title: sfu.recording.compose.progress
    description: The running compose job crossed a 10% progress bucket. Derived from ffmpeg's `time=` stderr line and deliberately throttled to one event per bucket (recording/RecordingManager.js:3965), which keeps bus traffic linear in recording count rather than in frame count. A short compose may emit this zero times; it never reports 100 — completion is what `sfu.recording.compose.completed` is for.
    servers:
      - $ref: "#/servers/signalRedis"
    messages:
      signal__sfu_recording_compose_progress__msg:
        $ref: "#/components/messages/signal__sfu_recording_compose_progress__msg"
    bindings:
      redis: {}
    x-event-catalog-transport: signal
  signal__sfu_recording_compose_failed:
    address: stream-events
    title: sfu.recording.compose.failed
    description: "The compose job failed and produced no usable output. Two emit sites carry DIFFERENT diagnostic fields: the windowed pre-pass failure (recording/RecordingManager.js:3897) sets `stage`, and the ffmpeg non-zero-exit / missing-output path (:4011) sets `exitCode`. A consumer must branch on which one is present rather than assume either; `reason` is the only human-readable field common to both."
    servers:
      - $ref: "#/servers/signalRedis"
    messages:
      signal__sfu_recording_compose_failed__msg:
        $ref: "#/components/messages/signal__sfu_recording_compose_failed__msg"
    bindings:
      redis: {}
    x-event-catalog-transport: signal
  signal__sfu_recording_compose_completed:
    address: stream-events
    title: sfu.recording.compose.completed
    description: The compose job finished and its composed render was uploaded and persisted (recording/RecordingManager.js:4093). This — not the `sfu.recording.completed` webhook — is the event that says a composed playback file exists, because compose runs after that webhook has already fired. `composeStatus` distinguishes a clean render from one ffmpeg exited zero on but that came out materially shorter than planned.
    servers:
      - $ref: "#/servers/signalRedis"
    messages:
