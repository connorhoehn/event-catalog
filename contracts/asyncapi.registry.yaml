    title: sfu-cluster → sfu.producer.removed
    summary: sfu-cluster publishes sfu.producer.removed
    description: A mediasoup Producer was closed — the underlying transport observer fired "close". Emitted from api/channels/index.js:624 and api/channels/transports.js:115.
    tags:
