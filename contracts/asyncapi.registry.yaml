          type: string
          description: Identifier of the rubric the judge scored against.
        judgeModel:
          type: string
          description: Anthropic model id used for the judge call.
        result:
          type: object
          description: Full JudgmentResult — rubricSnapshot, criteria[], overallScore/Verdict/Passed, model/tokens/cost, etc.
          additionalProperties: true
        usage:
          type: object
          properties:
            inputTokens:
              type: number
              description: Input (prompt) tokens consumed by the call.
            outputTokens:
              type: number
              description: Output (completion) tokens produced by the call.
            cacheReadTokens:
              type: number
              description: Input tokens served from the provider prompt cache.
