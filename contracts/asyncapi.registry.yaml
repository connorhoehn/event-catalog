    title: sfu-cluster → sfu.channel.created
    summary: sfu-cluster publishes sfu.channel.created
    description: A new IVS-style channel was created via POST /api/channels (api/channels/index.js:1375).
    tags:
      - name: sfu
      - name: producer:sfu-cluster
      - name: webhook
      - name: channel
