    title: sfu-cluster → sfu.producer.added
    summary: sfu-cluster publishes sfu.producer.added
    description: A mediasoup Producer was created on the cluster. Emitted from the create-producer API path (api/channels/index.js:617), which stamps identity and initial state, and from the transport produce path (api/channels/transports.js:110), which does not.
