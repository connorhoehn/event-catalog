          type: string
          description: Storage key of the written transcript.json, relative to the recording bucket.
        transcriptUrl:
          type: string
          description: Fetchable URL for the written transcript.json.
          format: uri
        durationMs:
          type: number
          description: Wall-clock duration in milliseconds.
        speakerCount:
          type: number
          description: Number of distinct speakers the ASR pass identified.
