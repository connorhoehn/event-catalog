    ws_crdt_awareness:
      messageId: ws.crdt.awareness
      name: ws.crdt.awareness
      title: ws.crdt.awareness
      summary: 'Coalesced Y.js awareness updates broadcast to all CRDT channel subscribers. GROUND TRUTH (gateway dist server/AwarenessCoalescer._broadcast): wire frame is { type:"crdt:awareness", channel, updates:[{ clientId, update }] } where each update is a base64-encoded Y.js awareness delta. This is the frame the running dist emits — distinct from the historical ws.crdt.awareness-batch (type "crdt:awareness-batch", per-entry { clientId, awareness }) which the current dist does NOT emit. Added per divergence note (b).'
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
