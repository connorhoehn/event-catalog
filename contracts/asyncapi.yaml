            description: Gateway channel (room) this frame is scoped to.
          message:
            type: string
            description: Human-readable message.
          metadata:
            type: object
            additionalProperties: true
            description: Free-form producer-supplied metadata; opaque to the transport and never interpreted by the gateway.
        required:
          - service
          - action
          - channel
          - message
        additionalProperties: true
    client_chat_history:
      messageId: client.chat.history
      name: client.chat.history
      title: client.chat.history
      summary: "Client request for recent chat message history for a channel (useChat.loadHistory). limit is optional — the gateway ChatService falls back to its configured default history limit when omitted (hub#1497 re-audit: limit was wrongly declared required)."
