      name: client.presence.set
      title: client.presence.set
      summary: 'Client request to set its presence entry (usePresence setStatus / updateMetadata). GROUND TRUTH (hub#1497): the gateway PresenceService requires status ("Status is required") and reads only { status, metadata, channels } — the channel field is sent by the hook but IGNORED by the service (presence pinning uses the channels array). Previously declared with channel required + status optional; both were wrong.'
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
          service:
            type: string
            const: presence
            description: Gateway fan-out service this frame belongs to. Paired with `action` it is the gateway's routing key.
          action:
            type: string
            const: set
            description: Verb the addressed service should perform.
          channel:
            type: string
            description: "DEPRECATED: sent by usePresence but ignored by the gateway PresenceService — channel pinning uses the channels array"
            deprecated: true
          status:
            type: string
            description: PresenceStatus, e.g. "online" | "away" | "busy"
          metadata:
            type: object
            additionalProperties: true
            description: Free-form producer-supplied metadata; opaque to the transport and never interpreted by the gateway.
          channels:
            type: array
            items:
              type: string
            description: channels to pin this presence entry to (defaults to [] server-side)
        required:
          - service
          - action
          - status
        additionalProperties: true
    client_presence_get:
      messageId: client.presence.get
      name: client.presence.get
      title: client.presence.get
      summary: 'Client request to read presence data for a single client (targetClientId) or a whole channel (channel). GROUND TRUTH (v0.3.57 backfill): gateway PresenceService.handleGetPresence requires AT LEAST ONE of targetClientId or channel ("Either targetClientId or channel is required" — an either-or constraint JSON-schema-encodable only via anyOf, which the type generator does not support, so both fields are declared optional here). targetClientId wins when both are present; unknown targetClientId yields "Client not found". Replies with a presence/presence action frame carrying the data. PRODUCER NOTE: no realtime-modules hook sends this frame as of 0.14.0 — declared as the gateway-verified verb for any WS client.'
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
