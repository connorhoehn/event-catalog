            description: WebSocket frame type — names the gateway fan-out service that produced this frame.
          timestamp:
            type: string
            description: ISO-8601 timestamp at which the producer emitted this frame.
            format: date-time
          runId:
            type: string
            description: Identifier of the run this event belongs to. The correlation key for every event in a single execution.
          fromVersion:
            type: number
            description: Run version the history was requested from; events before it are omitted.
          events:
            type: array
            items:
              type: object
              additionalProperties: true
            description: Ordered list of events, oldest first.
          correlationId:
            description: Client-supplied opaque id echoed back so a request can be matched to its response.
        required:
          - type
          - runId
          - events
        additionalProperties: true
    ws_pipeline_event:
      messageId: ws.pipeline.event
      name: ws.pipeline.event
      title: ws.pipeline.event
      summary: Pipeline BusEvent fan-out frame delivered to channel subscribers (pipeline:run:{runId}, pipeline:all, pipeline:approvals).
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
          type:
            type: string
            const: pipeline:event
            description: WebSocket frame type — names the gateway fan-out service that produced this frame.
          timestamp:
            type: string
            description: ISO-8601 timestamp at which the producer emitted this frame.
            format: date-time
          eventType:
            type: string
            description: Application-level event type carried inside this envelope frame (e.g. `search.started`).
          payload:
            type: object
            additionalProperties: true
            description: Frame body — the per-frame payload.
          channel:
            type: string
            description: Gateway channel (room) this frame is scoped to.
          seq:
            type: number
            description: Monotonic per-producer sequence counter — lets consumers detect drops and reordering.
          sourceNodeId:
            type: string
            description: Cluster node id of the gateway that originated the fan-out.
          emittedAt:
            type: number
            description: Epoch milliseconds at which the originating producer emitted the underlying event.
        required:
