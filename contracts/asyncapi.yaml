        required:
          - service
          - action
          - channel
        additionalProperties: true
    client_chat_send:
      messageId: client.chat.send
      name: client.chat.send
      title: client.chat.send
      summary: Client request to post a text chat message to a channel (useChat.sendMessage). The gateway ChatService requires a prior join on the channel ("You must join the channel before sending messages"). metadata is optional and size-validated server-side.
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
