components:
  messages:
    client_chat_join:
      messageId: client.chat.join
      name: client.chat.join
      title: client.chat.join
      summary: 'Client request to join a chat channel and start receiving its messages. Sent by GatewaySocketProvider on connect when the chat feature is declared. GROUND TRUTH (hub#1497): the gateway ChatService verb is "join" — the previously declared "subscribe" was never accepted. channel is required; on success the gateway replies chat/joined and auto-pushes recent channel history.'
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
          service:
            type: string
            const: chat
            description: Gateway fan-out service this frame belongs to. Paired with `action` it is the gateway's routing key.
          action:
            type: string
            const: join
            description: Verb the addressed service should perform.
          channel:
            type: string
            description: Gateway channel (room) this frame is scoped to.
        required:
          - service
          - action
          - channel
        additionalProperties: true
    client_chat_leave:
      messageId: client.chat.leave
      name: client.chat.leave
      title: client.chat.leave
      summary: 'Client request to leave a chat channel and stop receiving its messages. Sent by useChat cleanup on channel change/unmount as of realtime-modules 0.14.0. GROUND TRUTH (v0.3.57 backfill): gateway ChatService.handleLeaveChannel requires channel ("Channel name is required") and replies with a chat/left action frame; in distributed mode it also drops the message-router channel subscription.'
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
