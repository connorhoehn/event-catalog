          - eventType
          - channel
        additionalProperties: true
    ws_error:
      messageId: ws.error
      name: ws.error
      title: ws.error
      summary: "Generic error frame sent to a client when any gateway service encounters a client-visible error. GROUND TRUTH (gateway dist): chat/reaction/cursor/crdt nest under error:{ code, message, service, clientId, timestamp }; presence/activity send a flat top-level message. `service` names the originating service in both shapes."
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
          type:
            type: string
            const: error
            description: WebSocket frame type — names the gateway fan-out service that produced this frame.
          timestamp:
            type: string
            description: ISO-8601 timestamp at which the producer emitted this frame.
            format: date-time
          service:
            type: string
            description: The service that generated the error (chat, cursor, presence, etc.)
          code:
            type: string
            description: flat-shape error code (when no nested error object is present)
          message:
            type: string
            description: flat-shape human-readable message (presence/activity); for chat/reaction/cursor/crdt the message lives under error.message
          error:
            type: object
            description: nested error envelope emitted by chat/reaction/cursor/crdt
            properties:
              code:
                type: string
                description: Machine-readable error code.
              message:
                type: string
                description: Human-readable message.
              service:
                type: string
                description: Gateway fan-out service whose handler produced the error.
              clientId:
                type: string
                description: Gateway-assigned WebSocket connection id for one client socket.
              timestamp:
                type: string
                description: ISO-8601 timestamp at which the producer emitted this frame.
                format: date-time
            required:
              - code
              - message
            additionalProperties: true
        required:
          - type
        additionalProperties: true
    ws_session_connected:
      messageId: ws.session.connected
      name: ws.session.connected
      title: ws.session.connected
      summary: "Session welcome frame, sent once immediately after the WebSocket upgrade completes and before the client may send anything (src/server.ts:2507). It is load-bearing protocol, not a courtesy: the gateway queues every other outbound frame until this one has gone out (core/pre-session-queue.ts), and the client cannot reconnect without the `sessionToken` or feature-gate without `enabledServices`. `restored` tells the client whether its prior subscriptions came back with it — false both for a genuinely new connection and for a presented token the gateway could not restore, including the fallback path where a subscription restore failed and the connection was re-minted under a fresh clientId (server.ts:2399)."
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
          type:
            type: string
            const: session
            description: WebSocket frame type — names the gateway fan-out service that produced this frame.
          timestamp:
            type: string
            description: ISO-8601 timestamp at which the producer emitted this frame.
            format: date-time
          status:
            type: string
            const: connected
            description: Always the literal `connected` — the frame has no other outcome; a rejected upgrade never reaches this point.
          clientId:
            type: string
            description: Gateway-assigned connection id, echoed on subsequent frames. Preserved across a successful resume, re-minted otherwise.
          sessionToken:
            type: string
            description: Opaque resume token the client passes back as `?sessionToken=` on reconnect. Always a string here — a connection that presented no token, or an unusable one, has one minted before this frame is built (server.ts:2363).
          restored:
            type: boolean
            description: True when this connection resumed a prior session AND its subscriptions were restored.
          nodeId:
            type: string
            description: Cluster node id of the gateway instance serving this connection.
          enabledServices:
            type: array
            items:
              type: string
            description: Fan-out services this gateway has enabled (chat, presence, reaction, …). A client should not send frames for a service absent from this list.
        required:
          - type
          - status
          - clientId
          - sessionToken
          - restored
          - nodeId
          - enabledServices
        additionalProperties: true
    ws_subscribe_subscribed:
      messageId: ws.subscribe.subscribed
      name: ws.subscribe.subscribed
      title: ws.subscribe.subscribed
      summary: "Acknowledges that a client's generic-multiplexer subscribe took effect (realtime-fanout/subscribe-service.ts:191). Its ABSENCE is meaningful and is the reason this needed declaring: the handler returns early without an ack on either authz denial (the interceptor has already sent AUTHZ_CHANNEL_DENIED) or an unknown client, so a client that treats \"no ack\" as \"probably fine\" will believe it is subscribed to a channel the gateway refused it. Wait for this frame before assuming delivery."
      schemaFormat: application/schema+json;version=draft-07
      payload:
        type: object
        properties:
          type:
            type: string
            const: subscribe
            description: WebSocket frame type — names the gateway fan-out service that produced this frame.
          action:
            type: string
            const: subscribed
            description: Which action of the frame's service this frame reports.
          channel:
            type: string
            description: The raw channel name the multiplexer acted on, echoed back verbatim from the client's request.
        required:
          - type
          - action
          - channel
        additionalProperties: true
