asyncapi: 2.6.0
info:
  title: websocket-gateway WebSocket protocol
  version: 1.0.0
  description: |-
    Machine-readable contract for the websocket-gateway real-time WebSocket
    protocol, generated from the `@connorhoehn/event-catalog` declarations
    (`client.*` outbound frames + `ws.*` inbound send-backs).

    AUDIENCE: non-React / non-JS adopters who cannot read the
    `@connorhoehn/realtime-modules/client` hook source. JS/TS adopters
    should prefer the generated types (`@connorhoehn/event-catalog/types` +
    `/client-frames`).

    TRANSPORT: a single multiplexed WebSocket. All frames share one
    connection; there are no per-topic URLs. Frames are JSON. Outbound
    frames carry `{ service, action, channel?, ... }`; inbound frames carry
    a `type` discriminator.

    SCOPE: this document describes 110 of the registry's
    229 declarations — the gateway WebSocket frames, and
    only those. It is NOT the platform event inventory. The other
    119 declarations are broker-addressed backbone events
    (Redis pub/sub and the durable message-queue) and are described in the
    companion document `contracts/asyncapi.registry.yaml`. See
    `info.x-event-catalog-coverage` below for the exact partition rule.

    REGENERATE: `npm run generate-asyncapi` in @connorhoehn/event-catalog.
    DO NOT hand-edit — frame shapes are owned by src/declarations/.
  license:
    name: UNLICENSED
  x-event-catalog-coverage:
    registryDeclarations: 229
    describedInThisDocument: 110
    describedInCompanionDocument:
      file: contracts/asyncapi.registry.yaml
      count: 119
    partitionRule: "Declarations in namespace `client` or `ws` are gateway WebSocket frames: they carry no `channel` and no `queue` because they are multiplexed over one connection, so they are described in contracts/asyncapi.yaml as a single channel with a oneOf per direction. Every other declaration is broker-addressed (a Redis pub/sub channel or a message-queue queue) and is described in contracts/asyncapi.registry.yaml as one channel per event."
    fullInventory: contracts/registry.snapshot.json lists all 229 events with their schema fingerprints.
externalDocs:
  description: "Companion document: the broker-addressed backbone events this file does not cover."
  url: ./asyncapi.registry.yaml
servers:
  localDev:
    url: ws://localhost:8080/ws
    protocol: ws
    description: Local dev gateway (Tilt). Path/port may differ per deployment.
  production:
    url: wss://{host}/ws
    protocol: wss
    description: Deployed gateway. `host` is environment-specific.
    variables:
      host:
        default: gateway.example.com
        description: gateway hostname
defaultContentType: application/json
channels:
  /:
    description: The single multiplexed gateway WebSocket. All frames flow over this one connection — there are no per-topic URLs. Outbound (client→gateway) frames are JSON objects discriminated by `{ service, action }`; inbound (gateway→client) frames are discriminated by `type` (colon-form `service:variant` or an `{ type, action }` envelope). The connect URL accepts an auth token (Bearer header or `?token=` query per gateway config).
    bindings:
      ws:
        bindingVersion: 0.1.0
        method: GET
    publish:
      operationId: sendClientFrame
      summary: Frames the client SENDS to the gateway (client→gateway).
      description: "Every outbound frame is a JSON object with `service` + `action` string literals plus per-action fields. The gateway MessageValidator enforces the service/action/channel structure; extra fields pass through (additionalProperties: true)."
